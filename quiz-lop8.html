 2022: 59; 2023: 53). Năm nào có số học sinh đạt giải nhiều nhất?","o":["2022","2020","2021","2019"],"a":3,"e":"Giá trị lớn nhất là 60, ở năm 2019."},{"q":"Biểu đồ hình quạt tròn về phương tiện đến trường: Xe buýt 35%, Xe đạp 30%, Xe máy 20%, còn lại là “Ô tô”. Tỉ lệ phần trăm của “Ô tô” là:","o":["20%","77%","85%","15%"],"a":3,"e":"Tổng các tỉ lệ là 100%: 100% − (35% + 30% + 20%) = 15%."},{"q":"“Loại trái cây yêu thích” thuộc loại dữ liệu nào?","o":["Dữ liệu định lượng liên tục","Không phải dữ liệu thống kê","Dữ liệu định lượng rời rạc","Dữ liệu định tính"],"a":3,"e":"Loại trái cây yêu thích không phải là số, mô tả tính chất hay đặc điểm của đối tượng, nên là dữ liệu định tính."},{"q":"Biểu đồ đoạn thẳng cho số học sinh đạt giải qua các năm (2018: 44; 2019: 12; 2020: 57; 2021: 53; 2022: 33). Từ năm 2018 đến năm 2022, số học sinh thay đổi bao nhiêu (tăng dương, giảm âm)?","o":["+77","−11","+11","−15"],"a":1,"e":"33 − 44 = -11."},{"q":"Biểu đồ đoạn thẳng cho số học sinh đạt giải qua các năm (2021: 34; 2022: 32; 2023: 46; 2024: 33; 2025: 43). Từ năm 2021 đến năm 2025, số học sinh thay đổi bao nhiêu (tăng dương, giảm âm)?","o":["+77","+14","+9","−9"],"a":2,"e":"43 − 34 = 9."},{"q":"Khảo sát môn thể thao yêu thích của một nhóm học sinh được kết quả: Bóng bàn: 4, Bóng rổ: 5, Bơi lội: 10, Bóng đá: 6. Môn được yêu thích nhất là:","o":["Bóng bàn","Bóng đá","Bóng rổ","Bơi lội"],"a":3,"e":"Bơi lội có số lượng lớn nhất (10)."},{"q":"Để so sánh số sách của các thư viện lớp 8A, 8B, 8C, nên chọn loại biểu đồ nào?","o":["Biểu đồ tranh","Biểu đồ đoạn thẳng","Biểu đồ hình quạt tròn","Biểu đồ cột"],"a":3,"e":"So sánh một đại lượng giữa các đối tượng: dùng biểu đồ cột."},{"q":"Để biểu diễn sự thay đổi nhiệt độ trung bình của Hà Nội qua 12 tháng, nên chọn loại biểu đồ nào?","o":["Biểu đồ tranh","Biểu đồ cột kép","Biểu đồ hình quạt tròn","Biểu đồ đoạn thẳng"],"a":3,"e":"Thể hiện sự thay đổi theo thời gian: dùng biểu đồ đoạn thẳng."},{"q":"Khảo sát môn thể thao yêu thích của một nhóm học sinh được kết quả: Cờ vua: 3, Bóng rổ: 2, Bóng đá: 5, Cầu lông: 10. Môn được yêu thích nhất là:","o":["Bóng đá","Cờ vua","Bóng rổ","Cầu lông"],"a":3,"e":"Cầu lông có số lượng lớn nhất (10)."},{"q":"Để so sánh số điện thoại hai hãng A và B bán được trong 4 quý, nên chọn loại biểu đồ nào?","o":["Biểu đồ cột kép","Biểu đồ cột","Biểu đồ tranh","Biểu đồ hình quạt tròn"],"a":0,"e":"Hai hãng, mỗi quý hai cột: dùng biểu đồ cột kép."},{"q":"Biểu đồ hình quạt tròn về phương tiện đến trường của 200 học sinh: Xe buýt 45%, Ô tô 25%, Xe đạp 20%, Đi bộ 10%. Số học sinh đi bằng “Ô tô” là:","o":["49","53","51","50"],"a":3,"e":"25% của 200 = 200·25/100 = 50."},{"q":"“Số tin nhắn nhận mỗi ngày” thuộc loại dữ liệu nào?","o":["Dữ liệu định lượng liên tục","Dữ liệu định lượng rời rạc","Không phải dữ liệu thống kê","Dữ liệu định tính"],"a":1,"e":"Số tin nhắn nhận mỗi ngày là số, nhận một số hữu hạn (hoặc đếm được) giá trị, thường thu được bằng cách đếm, nên là dữ liệu định lượng rời rạc."},{"q":"Khảo sát môn thể thao yêu thích của một nhóm học sinh được kết quả: Bóng bàn: 3, Bóng rổ: 12, Bơi lội: 7, Cờ vua: 78. Môn được yêu thích nhất là:","o":["Bóng bàn","Bóng rổ","Bơi lội","Cờ vua"],"a":3,"e":"Cờ vua có số lượng lớn nhất (78)."},{"q":"Biểu đồ hình quạt tròn về phương tiện đến trường của 500 học sinh: Xe máy 50%, Ô tô 25%, Xe buýt 15%, Xe đạp 10%. Số học sinh đi bằng “Xe máy” là:","o":["250","62500","251","247"],"a":0,"e":"50% của 500 = 500·50/100 = 250."},{"q":"Khảo sát môn thể thao yêu thích của một nhóm học sinh được kết quả: Bóng bàn: 8, Bơi lội: 12, Bóng đá: 11, Bóng rổ: 19. Số học sinh được khảo sát là:","o":["49","53","47","50"],"a":3,"e":"Tổng số = 8 + 12 + 11 + 19 = 50."},{"q":"Khảo sát môn thể thao yêu thích: Bơi lội: 7, Bóng bàn: 11, Bóng đá: 3, Cầu lông: 4. Môn nhiều nhất hơn môn ít nhất bao nhiêu học sinh?","o":["64","10","8","7"],"a":2,"e":"11 − 3 = 8."}]}];</script>
<script>
var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))};
function sh(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=R(0,k),t=a[k];a[k]=a[j];a[j]=t}return a}
var pk=function(a,n){return sh(a).slice(0,n)};
var $=function(i){return document.getElementById(i)};

var T8=(typeof window!=="undefined"&&window.TOAN8_DATA)?window.TOAN8_DATA:[];
var T8MIX=15,T8TOPIC=20;
function t8norm(q){var c=q.o[q.a],d=q.o.filter(function(_,j){return j!=q.a});return {q:q.q,c:c,d:d,e:q.e}}
function t8all(){var all=[];T8.forEach(function(ch){ch.qs.forEach(function(q){all.push(q)})});return all}
function genMix(list){return list?list.slice():pk(t8all(),T8MIX).map(t8norm)}
function genTopic(k,list){return list?list.slice():pk(T8[k-1].qs,T8TOPIC).map(t8norm)}

var MODE="mix",K=1,pool=[],i=0,score=0,wrong=[],done=false;

/* ===== Lịch sử làm bài (localStorage) ===== */
var HKEY="quiz8_history_v1";
function loadHist(){try{var r=localStorage.getItem(HKEY);return r?JSON.parse(r):[]}catch(e){return[]}}
function saveHist(h){try{localStorage.setItem(HKEY,JSON.stringify(h))}catch(e){}}
function addHist(sc,total){
 var h=loadHist(),topic=(MODE=="mix")?"Tổng hợp (15 câu)":(T8[K-1].c+". "+T8[K-1].t);
 h.unshift({ts:Date.now(),subject:"Toán 8",topic:topic,score:sc,total:total});
 if(h.length>100)h=h.slice(0,100);
 saveHist(h)}
function clearHist(){saveHist([]);show()}
function fmtTime(ts){var d=new Date(ts),p=function(n){return(n<10?"0":"")+n};
 return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function histHTML(){
 var h=loadHist();
 var out='<div class="hist"><h2>Lịch sử làm bài</h2>';
 if(!h.length)return out+'<p class="hempty">Chưa có lịch sử. Hoàn thành một bộ quiz để lưu lại.</p></div>';
 out+='<table class="htbl"><thead><tr><th>Thời gian</th><th>Chủ điểm</th><th>Điểm</th></tr></thead><tbody>';
 h.forEach(function(r){out+='<tr><td>'+fmtTime(r.ts)+'</td><td>'+esc(r.subject)+' – '+esc(r.topic)+'</td><td class="sc">'+r.score+'/'+r.total+'</td></tr>'});
 out+='</tbody></table><button class="link" id="clr">Xóa toàn bộ lịch sử</button></div>';
 return out}

/* ===== Điều hướng chế độ & chương ===== */
function setModeTabs(){$("mmix").setAttribute("aria-selected",MODE=="mix");$("mtopic").setAttribute("aria-selected",MODE=="topic")}

function goMix(list){MODE="mix";setModeTabs();$("chips").innerHTML="";
 pool=genMix(list);i=0;score=0;wrong=[];show()}

function go(k,list){MODE="topic";K=k||1;setModeTabs();$("chips").innerHTML="";
 T8.forEach(function(ch,j){var b=document.createElement("button");b.className="chip";b.textContent=ch.c+". "+ch.t;b.setAttribute("aria-pressed",j+1==K);b.onclick=function(){go(j+1)};$("chips").appendChild(b)});
 pool=genTopic(K,list);i=0;score=0;wrong=[];show()}

$("mmix").onclick=function(){goMix()};
$("mtopic").onclick=function(){go(1)};

var saved=false;
function show(){
 var box=$("box");
 if(!T8.length){box.innerHTML='<div class="card"><p>Không nạp được dữ liệu Toán 8. Hãy đảm bảo tệp <b>data-toan8.js</b> nằm cùng thư mục.</p></div>';return}
 if(i>=pool.length){
  if(!saved){addHist(score,pool.length);saved=true}
  var pc=Math.round(score*100/pool.length),msg=pc>=90?"Xuất sắc!":pc>=70?"Khá tốt, ôn thêm vài câu nữa nhé.":"Hãy xem lại kiến thức rồi thử bộ mới.";
  var newLabel=MODE=="mix"?"Bộ 15 câu mới":"Bộ 20 câu mới";
  var emo=pc>=90?"🏆":pc>=70?"🎉":pc>=50?"😊":"\uD83D\uDE2D";
  box.innerHTML='<div class="card"><div class="meta">Kết quả</div><div style="font-size:3.4rem;line-height:1;margin:4px 0">'+emo+'</div><div class="big">'+score+'/'+pool.length+'</div><p>'+pc+'% đúng. '+msg+'</p><button class="btn" id="nw">'+newLabel+'</button>'+(wrong.length?'<button class="btn alt" id="rd">Ôn '+wrong.length+' câu sai</button>':'')+'</div>'+histHTML();
  $("nw").onclick=function(){MODE=="mix"?goMix():go(K)};
  if(wrong.length)$("rd").onclick=function(){MODE=="mix"?goMix(wrong.slice()):go(K,wrong.slice())};
  var c=$("clr");if(c)c.onclick=clearHist;
  return}
 saved=false;
 var q=pool[i],o=sh([{t:q.c,ok:1}].concat(q.d.map(function(t){return {t:t,ok:0}})));done=false;
 box.innerHTML='<div class="card"><div class="meta"><span>Câu '+(i+1)+'/'+pool.length+'</span><span>Đúng: '+score+'</span></div><div class="bar"><i style="width:'+(i*100/pool.length)+'%"></i></div><div class="q" id="qq"></div><div id="os"></div><div id="ex" hidden></div></div>';
 $("qq").textContent=q.q;
 o.forEach(function(x){var b=document.createElement("button");b.className="opt";b.textContent=x.t;b.onclick=function(){pick(b,x.ok,q,o)};$("os").appendChild(b)})}
function pick(b,ok,q,o){
 if(done)return;done=true;var bs=$("os").children;
 for(var k=0;k<bs.length;k++){bs[k].disabled=true;if(o[k].ok)bs[k].classList.add("ok")}
 if(ok)score++;else{b.classList.add("no");wrong.push(q)}
 var e=$("ex");e.hidden=false;e.className="exp";e.innerHTML='<b>'+(ok?"Chính xác!":"Chưa đúng.")+'</b> <span id="et"></span><br><button class="btn" id="nx">'+(i+1<pool.length?"Câu tiếp theo":"Xem kết quả")+'</button>';
 $("et").textContent=q.e;$("nx").onclick=function(){i++;show()};$("nx").focus()}
goMix();
</script>
</body>
</html>
