/* ---------- TIỆN ÍCH ---------- */
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Tabs */
const tabs=[...document.querySelectorAll('[role=tab]')];
tabs.forEach((t,i)=>{
  t.onclick=()=>tabs.forEach((x,j)=>{x.setAttribute('aria-selected',i===j);$('#p'+j).hidden=i!==j});
  t.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const n=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];n.focus();n.click()}};
});

/* Tab 1: Ngữ pháp */
$('#p0').innerHTML=G.map((u,i)=>`<details${i===0?' open':''}><summary>${esc(u.t)}</summary><div class="body">`+
  u.s.map(p=>`<p class="pair"><b>${esc(p[0])}</b><span>${esc(p[1])}</span></p>`).join('')+
  `<p class="meta"><strong>Từ vựng:</strong> ${esc(u.v)}</p>`+(u.st?`<p class="meta"><strong>Trọng âm:</strong> ${esc(u.st)}</p>`:'')+`</div></details>`).join('')+
  `<div class="note"><h2>Lưu ý chung</h2><ul>${NOTES.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`;

/* Bộ máy quiz dùng chung */
function quiz(box,items,unitLabel){
  let i=0,score=0,wrong=[];
  const draw=()=>{
    if(!items.length){box.innerHTML='<div class="q"><p>Chưa có câu hỏi cho phần này.</p></div>';return}
    if(i>=items.length){
      var rpc=items.length?score/items.length:0,emo=rpc>=0.9?'🏆':rpc>=0.7?'🎉':rpc>=0.5?'😊':'😭';
      box.innerHTML=`<div class="q end"><div style="font-size:3.4rem;line-height:1;margin:4px 0">${emo}</div><p class="score">${score}/${items.length}</p><p>${score===items.length?'Tuyệt vời! Bạn trả lời đúng hết.':score>=items.length*0.7?'Rất tốt! Xem lại vài câu sai nhé.':'Cố lên! Ôn lại phần Ngữ pháp rồi thử lại.'}</p>`+
      (wrong.length?`<p style="text-align:left"><b>Câu cần ôn:</b></p>`+wrong.map(w=>`<p class="pair" style="text-align:left"><b>${esc(w.q)}</b><span>Đáp án: ${esc(w.a)}</span></p>`).join(''):'')+
      `<button class="btn pri" id="again">Chơi vòng mới</button></div>`;
      box.querySelector('#again').onclick=unitLabel;return;
    }
    const it=items[i];
    box.innerHTML=`<div class="q"><div class="prog"><span>Câu ${i+1}/${items.length}</span><span>Đúng: ${score}</span></div><div class="track"><i style="width:${i/items.length*100}%"></i></div><p class="qt">${esc(it.q)}</p><div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><p class="fb" aria-live="polite"></p><div id="nx"></div></div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=it.o[b.dataset.k]===it.a;
      box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(it.o[x.dataset.k]===it.a)x.classList.add('ok')});
      if(ok)score++;else{b.classList.add('bad');wrong.push(it)}
      box.querySelector('.fb').textContent=(ok?'Chính xác! ':'Chưa đúng. ')+(it.e||'');
      box.querySelector('#nx').innerHTML=`<button class="btn pri" style="margin-top:10px" id="next">${i+1===items.length?'Xem kết quả':'Câu tiếp'}</button>`;
      const n=box.querySelector('#next');n.focus();n.onclick=()=>{i++;draw()};
    });
  };
  draw();
}

/* Tab 2: Quiz từ vựng */
function startV(){
  const dir=$('#vDir').value;
  const pick=shuffle(V).slice(0,10);
  const items=pick.map(w=>{
    const ev=dir==='ev',ans=ev?w[1]:w[0];
    const others=shuffle(V.filter(x=>x!==w)).slice(0,3).map(x=>ev?x[1]:x[0]);
    return{q:ev?`"${w[0]}" nghĩa là gì?`:`"${w[1]}" trong tiếng Anh là gì?`,a:ans,o:shuffle([ans,...others]),e:`${w[0]} = ${w[1]} (Unit ${w[2]})`};
  });
  quiz($('#vBox'),items,startV);
}
$('#vGo').onclick=startV;$('#vDir').onchange=startV;startV();

/* Tab 3: Quiz ngữ pháp */
function startG(){
  const items=shuffle(Q).slice(0,10).map(x=>({q:x[1],a:x[2],o:shuffle([x[2],...x[3]]),e:x[4]}));
  quiz($('#gBox'),items,startG);
}
$('#gGo').onclick=startG;startG();
</script>
