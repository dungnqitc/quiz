/* ---------- TIỆN ÍCH ---------- */
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Tabs */
const tabs=[...document.querySelectorAll('[role=tab]')];
tabs.forEach((t,i)=>{
  t.onclick=()=>tabs.forEach((x,j)=>{x.setAttribute('aria-selected',i===j);$('#p'+j).hidden=i!==j});
  t.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const n=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];n.focus();n.click()}};
});

/* Tab 1: Ngữ pháp */
$('#p0').innerHTML=G.map((u,i)=>`<details${i===0?' open':''}><summary>${esc(u.t)}</summary><div class="body">`+
  u.s.map(p=>`<p class="pair"><b>${esc(p[0])}</b><span>${esc(p[1])}</span></p>`).join('')+
  `<p class="meta"><strong>Từ vựng:</strong> ${esc(u.v)}</p>`+(u.st?`<p class="meta"><strong>Trọng âm:</strong> ${esc(u.st)}</p>`:'')+`</div></details>`).join('')+
  `<div class="note"><h2>Lưu ý chung</h2><ul>${NOTES.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`;

/* Lịch sử làm bài (localStorage) */
var HKEY="quizanh5_history_v1";
function addHistEN(topic,score,total,wrong){
  try{var h=JSON.parse(localStorage.getItem(HKEY)||"[]");
    h.unshift({ts:Date.now(),subject:"Tiếng Anh 5",topic:topic,score:score,total:total,wrong:wrong||[]});
    if(h.length>100)h=h.slice(0,100);
    localStorage.setItem(HKEY,JSON.stringify(h));}catch(e){}
}

/* Bộ máy quiz dùng chung */
function quiz(box,items,unitLabel,topicLabel){
  let i=0,score=0,wrong=[],saved=false;
  const draw=()=>{
    if(!items.length){box.innerHTML='<div class="q"><p>Chưa có câu hỏi cho phần này.</p></div>';return}
    if(i>=items.length){
      if(!saved){saved=true;addHistEN(topicLabel||'Quiz',score,items.length,wrong.map(w=>({q:w.q,your:w.your,correct:w.a})))}
      var rpc=items.length?score/items.length:0,emo=rpc>=0.9?'🏆':rpc>=0.7?'🎉':rpc>=0.5?'😊':'\uD83D\uDE2D';
      box.innerHTML=`<div class="q end"><div style="font-size:3.4rem;line-height:1;margin:4px 0">${emo}</div><p class="score">${score}/${items.length}</p><p>${score===items.length?'Tuyệt vời! Bạn trả lời đúng hết.':score>=items.length*0.7?'Rất tốt! Xem lại vài câu sai nhé.':'Cố lên! Ôn lại phần Ngữ pháp rồi thử lại.'}</p>`+
      (wrong.length?`<p style="text-align:left"><b>Câu cần ôn:</b></p>`+wrong.map(w=>`<p class="pair" style="text-align:left"><b>${esc(w.q)}</b><span>Đáp án: ${esc(w.a)}</span></p>`).join(''):'')+
      `<button class="btn pri" id="again">Chơi vòng mới</button></div>`;
      box.querySelector('#again').onclick=unitLabel;return;
    }
    const it=items[i];
    box.innerHTML=`<div class="q"><div class="prog"><span>Câu ${i+1}/${items.length}</span><span>Đúng: ${score}</span></div><div class="track"><i style="width:${i/items.length*100}%"></i></div><p class="qt">${esc(it.q)}</p><div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><p class="fb" aria-live="polite"></p><div id="nx"></div></div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=it.o[b.dataset.k]===it.a;
      box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(it.o[x.dataset.k]===it.a)x.classList.add('ok')});
      if(ok)score++;else{b.classList.add('bad');wrong.push({q:it.q,a:it.a,your:it.o[b.dataset.k]})}
      box.querySelector('.fb').textContent=(ok?'Chính xác! ':'Chưa đúng. ')+(it.e||'');
      box.querySelector('#nx').innerHTML=`<button class="btn pri" style="margin-top:10px" id="next">${i+1===items.length?'Xem kết quả':'Câu tiếp'}</button>`;
      const n=box.querySelector('#next');n.focus();n.onclick=()=>{i++;draw()};
    });
  };
  draw();
}

/* Tab 2: Quiz từ vựng */
function startV(){
  const pick=shuffle(V).slice(0,20);
  const half=Math.round(pick.length/2);
  const items=pick.map((w,idx)=>{
    const ev=idx<half,ans=ev?w[1]:w[0];
    const others=shuffle(V.filter(x=>x!==w)).slice(0,3).map(x=>ev?x[1]:x[0]);
    return{q:ev?`"${w[0]}" nghĩa là gì?`:`"${w[1]}" trong tiếng Anh là gì?`,a:ans,o:shuffle([ans,...others]),e:`${w[0]} = ${w[1]}` + (w[2]?` (Unit ${w[2]})`:" (Từ vựng cơ bản)")};
  });
  quiz($('#vBox'),shuffle(items),startV,"Quiz từ vựng");
}
$('#vGo').onclick=startV;startV();

/* Tab 3: Quiz ngữ pháp */
/* Điền danh sách Unit vào ô chọn phạm vi (G theo chỉ số 0 = Starter, 1..10 = Unit 1..10) */
function fillUnitSelect(){
  const sel=$('#gUnit');if(!sel)return;
  const all=document.createElement('option');all.value='';all.textContent='Tất cả Unit';sel.appendChild(all);
  G.forEach((g,idx)=>{
    if(!Q.some(x=>x[0]===idx))return;
    const o=document.createElement('option');o.value=String(idx);o.textContent=(g&&g.t)?g.t:('Unit '+idx);sel.appendChild(o);
  });
}
/* Chọn n câu theo tỉ lệ 70% cơ bản / 30% nâng cao từ một tập câu hỏi */
function pick7030(src,n){
  const nb=Math.round(n*0.7),na=n-nb;
  const basics=shuffle(src.filter(x=>x[5]!=="a"));
  const adv=shuffle(src.filter(x=>x[5]==="a"));
  let b=basics.slice(0,nb),a=adv.slice(0,na);
  const need=n-(b.length+a.length);
  if(need>0){const rest=basics.slice(b.length).concat(adv.slice(a.length));b=b.concat(rest.slice(0,need));}
  return b.concat(a);
}
function startG(){
  const uv=$('#gUnit')?$('#gUnit').value:'';
  const src=uv!==''?Q.filter(x=>x[0]===parseInt(uv)):Q;
  const topicLabel=uv!==''?('Quiz ngữ pháp – '+((G[parseInt(uv)]&&G[parseInt(uv)].t)||('Unit '+uv))):'Quiz ngữ pháp';
  const items=shuffle(pick7030(src,20)).map(x=>{
    const unitTitle=(G[x[0]]&&G[x[0]].t)?G[x[0]].t:("Unit "+x[0]);
    const lvl=x[5]==="a"?" (nâng cao)":"";
    const e='Đáp án đúng: "'+x[2]+'". '+x[4]+lvl+' — Ôn thêm ở tab "Ngữ pháp" › '+unitTitle+'.';
    return{q:x[1],a:x[2],o:shuffle([x[2],...x[3]]),e:e};
  });
  quiz($('#gBox'),items,startG,topicLabel);
}
fillUnitSelect();
$('#gGo').onclick=startG;startG();
