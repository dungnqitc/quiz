rd:{p:`Many people now think that teachers give pupils too much homework. They say that it is unnecessary for children to work at home in their free time. Moreover, they argue that most teachers do not properly plan the homework task they give to pupils. The result is that pupils have to repeat tasks which they have already done at school.
Recently in Greece many parents complained about the difficult homework which teachers gave to their children. The parents said that most of the homework was a waste of time, and they wanted to stop it. Spain and Turkey are two countries which stopped homework recently. In Denmark, Germany and several other countries in Europe, teachers cannot set homework at weekends. In Holland, teachers allow pupils to stay at school to do their homework. The children are free to help one another. Similar arrangements also exist in some British schools.
Most people agree that homework is unfair. A pupil who can do his homework in a quiet and comfortable room is in a much better position than a pupil who does his homework in a small, noisy room with the television on. Some parents help their children with their homework. Other parents take no interest at all in the children's homework.
It is important, however, that teachers talk to parents about homework. A teacher should suggest suitable tasks for parents to do with their children. Parents are often better at teaching their own children.`,k:'BDCAD',q:`According to the writer, many parents would like their children ___.|to do homework at school only|to have less homework|to do more difficult homework|to do homework both at school and at home

cz:{p:`The Internet is very useful. Online, you can pay your bills, buy clothes, and read the news. There [1] many good reasons to spend time online. However, people with Internet addiction are online too much. They don't spend time [2] their friends and family. Instead, they spend their time chatting with their Internet friends, people they have never [3] in real life. Some also play online games all day or night. Some people with Internet addictions even leave their jobs so they can spend even more time online! People with Internet addictions don't just go online to shop, have fun, or do work. People [4] have this problem often go online because they want to [5] from the stress and problems in their lives. Many internet addicts stop caring about their real lives and focus only on their online lives.`,o:'has,are,have,is;about,to,of,with;faced,met,watched,reunited;when,what,who,which;escape,stop,ban,hide',k:'BDBCA'},
rd:{t:'Steve Cummins talks about starting his own business',p:`I'd worked for the company for almost ten years. They were good employers and the money wasn't that bad. They trusted in my ability and always left me to get on with my work. And I shared an office and met some lovely people, so I certainly wasn't unhappy there. But I just couldn't stop wondering how better my life would be if I had my own business and could make my own decisions. And so one year ago this week, I left my job.
We don't have a spare room at home, so the kitchen table has been my office. It was difficult to begin with, but I soon got used to working in this way. I started by visiting small businesses in the area to see if I could interest them in my services. My proudest moment was making my first sale, a website for a local cake shop. Soon after, I started getting calls from other people asking for help with websites of their own, and I found myself getting quite busy.
Of course, there have been challenges. I'm not earning quite as much as before, but it's enough, I don't have to pay for transport to work anymore, so that means I'm not spending quite so much. My biggest problem has been managing my time. There's no boss to tell me what to do, and I'm sometimes a little … I have this rule that work stops on a Friday afternoon, so I can spend time with the family at weekends, so I need to pay more attention to this.
So, I wouldn't say it's been easy, but I don't regret my decision at all. I've enjoyed being my own boss and I'm quite hopeful about the future. During the next 12 months, I plan to rent some office space as I'd like to be able to separate work from my home life. I'm going to need to earn more money to pay for it, but I think it will help me to focus on my work.`,k:'BAACC',q:`Why did Steve leave his job?|He didn't like attending meetings.|He wanted more control of his work.|He had a great idea for a product.|He wanted to earn more money.
