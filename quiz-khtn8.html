<h1>Quiz KHTN 8 – SGK</h1>
<p class="sub">Chọn <b>Quiz tổng hợp</b> (15 câu ngẫu nhiên từ cả 3 phân môn) hoặc <b>Quiz theo chủ đề</b> (chọn Hóa / Lí / Sinh, 20 câu ngẫu nhiên).</p>

<script>window.KHTN_S=[["Hóa học","--a0"],["Vật lí","--a1"],["Sinh học","--a2"]];window.KHTN_Q=[[0,"Mol","Thể tích của 1 mol khí ở điều kiện chuẩn (25 °C, 1 bar) là bao nhiêu?",["22,4 L","24,79 L","22,79 L","24 mL"],1,"Ở điều kiện chuẩn (25 °C, 1 bar), 1 mol khí chiếm 24,79 L. Giá trị 22,4 L chỉ đúng ở 0 °C, 1 atm."],[0,"Nồng độ dung dịch","Hòa tan 20 g muối vào 80 g nước. Nồng độ phần trăm của dung dịch là?",["20%","25%","16%","80%"],0,"m_dd = 20 + 80 = 100 g nên C% = 20/100 × 100% = 20%. Chú ý mẫu số là khối lượng dung dịch, không phải khối lượng nước."],[0,"Bảo toàn khối lượng","Đốt 2,4 g Mg trong oxygen thu được 4,0 g MgO. Khối lượng oxygen đã phản ứng là?",["1,6 g","6,4 g","2,4 g","0,8 g"],0,"Theo định luật bảo toàn khối lượng: m(O₂) = m(MgO) − m(Mg) = 4,0 − 2,4 = 1,6 g."],[0,"Tỉ khối chất khí","Khí CO₂ so với không khí thì thế nào?",["Nhẹ hơn, d ≈ 0,66","Nặng hơn, d ≈ 1,52","Nặng hơn, d ≈ 2,2","Nặng bằng nhau"],1,"d = M(CO₂)/29 = 44/29 ≈ 1,52 > 1 nên CO₂ nặng hơn không khí."],[0,"Tốc độ phản ứng","Biện pháp nào KHÔNG làm tăng tốc độ phản ứng?",["Tăng nhiệt độ","Nghiền nhỏ chất rắn","Dùng chất xúc tác","Giảm nồng độ chất phản ứng"],3,"Tăng nhiệt độ, tăng diện tích tiếp xúc và dùng xúc tác đều làm phản ứng nhanh hơn. Giảm nồng độ thì làm phản ứng chậm đi."],[0,"Acid – Base","Dung dịch có pH = 3 có tính chất nào?",["Acid","Base","Trung tính","Lưỡng tính"],0,"pH < 7 là môi trường acid, pH = 7 là trung tính, pH > 7 là base."],[0,"Oxide","CO₂ thuộc loại oxide nào?",["Oxide base","Oxide acid","Oxide lưỡng tính","Oxide trung tính"],1,"CO₂ tác dụng với dung dịch base tạo muối và nước, nên là oxide acid."],[0,"Phân bón","Phân đạm (như urea) chủ yếu cung cấp nguyên tố nào cho cây?",["Nitrogen (N)","Phosphorus (P)","Potassium (K)","Calcium (Ca)"],0,"Đạm cung cấp N, lân cung cấp P, kali cung cấp K."],[0,"Tính theo phương trình","Theo 2H₂ + O₂ → 2H₂O, cần bao nhiêu mol O₂ để đốt cháy hết 0,6 mol H₂?",["0,3 mol","0,6 mol","1,2 mol","0,15 mol"],0,"Tỉ lệ mol H₂ : O₂ = 2 : 1 nên n(O₂) = 0,6/2 = 0,3 mol."],[0,"Acid – Base","Phản ứng NaOH + HCl → NaCl + H₂O thuộc loại nào?",["Phản ứng trung hòa","Phản ứng phân hủy","Phản ứng thế","Phản ứng cháy"],0,"Acid tác dụng với base tạo muối và nước là phản ứng trung hòa."],[1,"Khối lượng riêng","Một vật có khối lượng 540 g, thể tích 200 cm³. Khối lượng riêng của vật là?",["2,7 g/cm³","0,37 g/cm³","3,7 g/cm³","27 g/cm³"],0,"D = m/V = 540/200 = 2,7 g/cm³."],[1,"Áp suất","Lực ép 600 N tác dụng lên diện tích 0,3 m². Áp suất là bao nhiêu?",["180 Pa","2000 Pa","200 Pa","20 000 Pa"],1,"p = F/S = 600/0,3 = 2000 Pa."],[1,"Áp suất chất lỏng","Khi thợ lặn xuống sâu hơn, áp suất nước tác dụng lên người thế nào?",["Giảm","Không đổi","Tăng","Lúc tăng lúc giảm"],2,"Áp suất chất lỏng p = d·h tỉ lệ thuận với độ sâu h nên càng lặn sâu càng tăng."],[1,"Lực đẩy Archimedes","Vật chìm trong chất lỏng khi nào?",["Lực đẩy lớn hơn trọng lượng","Trọng lượng riêng của vật lớn hơn của chất lỏng","Trọng lượng riêng của vật nhỏ hơn của chất lỏng","Thể tích vật rất nhỏ"],1,"Vật chìm khi trọng lượng lớn hơn lực đẩy Archimedes, tức d_vật > d_chất lỏng."],[1,"Moment lực","Lực 20 N có tay đòn 0,5 m. Moment lực là?",["40 N·m","10 N·m","2,5 N·m","10 N"],1,"M = F·d = 20 × 0,5 = 10 N·m. Đơn vị moment lực là N·m, không phải N."],[1,"Đòn bẩy","Đòn bẩy cân bằng với F₁ = 50 N, d₁ = 0,4 m, d₂ = 0,2 m. Lực F₂ bằng?",["25 N","100 N","10 N","50 N"],1,"Điều kiện cân bằng F₁d₁ = F₂d₂ nên F₂ = 50 × 0,4/0,2 = 100 N."],[1,"Điện","Hai vật nhiễm điện cùng loại khi đặt gần nhau sẽ?",["Hút nhau","Đẩy nhau","Không tương tác","Hút rồi đẩy"],1,"Các điện tích cùng loại đẩy nhau, khác loại hút nhau."],[1,"Cường độ dòng điện","Ampe kế được mắc vào mạch như thế nào?",["Nối tiếp với thiết bị cần đo","Song song với thiết bị cần đo","Mắc thế nào cũng được","Không cần mắc vào mạch"],0,"Ampe kế đo cường độ dòng điện nên mắc nối tiếp. Vôn kế đo hiệu điện thế mới mắc song song."],[1,"Truyền nhiệt","Hình thức truyền nhiệt chủ yếu trong chất lỏng và chất khí là gì?",["Dẫn nhiệt","Đối lưu","Bức xạ nhiệt","Không truyền nhiệt"],1,"Chất lỏng và chất khí nóng lên nở ra, nhẹ đi và dịch chuyển, tạo dòng đối lưu mang nhiệt."],[1,"Sự nở vì nhiệt","Khi nóng lên, hầu hết các chất rắn sẽ?",["Co lại","Nở ra","Không đổi thể tích","Hóa lỏng ngay"],1,"Đa số chất rắn nở ra khi nóng lên và co lại khi lạnh đi, nên đường ray và cầu thép có khe giãn nở."],[2,"Tiêu hóa","Cơ quan nào hấp thụ phần lớn chất dinh dưỡng?",["Dạ dày","Ruột non","Ruột già","Thực quản"],1,"Ruột non có niêm mạc gấp nếp, nhiều lông ruột nên hấp thụ phần lớn chất dinh dưỡng."],[2,"Máu và tuần hoàn","Thành phần nào của máu vận chuyển oxygen?",["Bạch cầu","Tiểu cầu","Hồng cầu","Huyết tương"],2,"Hồng cầu chứa hemoglobin, liên kết với oxygen để vận chuyển đến các tế bào."],[2,"Hô hấp","Sự trao đổi khí ở phổi diễn ra tại đâu?",["Khí quản","Phế quản","Phế nang","Thanh quản"],2,"Phế nang có thành mỏng, bao quanh là mao mạch nên O₂ và CO₂ khuếch tán dễ dàng."],[2,"Bài tiết","Cơ quan nào lọc máu để tạo nước tiểu?",["Gan","Thận","Bàng quang","Niệu đạo"],1,"Thận lọc máu, loại bỏ chất thải và nước thừa để tạo nước tiểu."],[2,"Nội tiết","Hormone insulin điều hòa đường huyết do tuyến nào tiết ra?",["Tuyến giáp","Tuyến tụy","Tuyến yên","Tuyến thượng thận"],1,"Tuyến tụy tiết insulin làm giảm đường huyết, nên thiếu insulin gây bệnh tiểu đường."],[2,"Thần kinh","Phản xạ là gì?",["Phản ứng của cơ thể trả lời kích thích, thông qua hệ thần kinh","Sự sinh trưởng của tế bào","Sự trao đổi khí ở phổi","Sự tiết hormone của tuyến nội tiết"],0,"Phản xạ là phản ứng của cơ thể đối với kích thích từ môi trường, có sự tham gia của hệ thần kinh."],[2,"Da và thân nhiệt","Khi trời nóng, cơ thể tăng tỏa nhiệt chủ yếu bằng cách nào?",["Co mạch máu dưới da","Đổ mồ hôi và giãn mạch máu dưới da","Run cơ","Dựng lông"],1,"Mồ hôi bay hơi lấy nhiệt, mạch máu giãn giúp tỏa nhiệt ra ngoài. Co mạch và run cơ giúp giữ ấm khi lạnh."],[2,"Sinh sản","Thụ tinh ở người thường diễn ra ở đâu?",["Tử cung","Ống dẫn trứng","Âm đạo","Buồng trứng"],1,"Tinh trùng gặp trứng và thụ tinh ở ống dẫn trứng, sau đó hợp tử di chuyển về tử cung để làm tổ."],[2,"Nhân tố sinh thái","Nhân tố nào sau đây là nhân tố hữu sinh?",["Ánh sáng","Nhiệt độ","Vi khuẩn","Độ ẩm"],2,"Nhân tố hữu sinh là các sinh vật. Ánh sáng, nhiệt độ, độ ẩm là nhân tố vô sinh."],[2,"Hệ sinh thái","Trong chuỗi thức ăn, sinh vật sản xuất thường là?",["Thực vật","Hổ","Nấm","Vi khuẩn phân giải"],0,"Thực vật quang hợp tạo chất hữu cơ từ chất vô cơ nên là sinh vật sản xuất."],[0,"Phản ứng hóa học","Dấu hiệu nào chắc chắn cho biết có phản ứng hóa học xảy ra?",["Có chất mới tạo thành","Chất đổi trạng thái","Chất bị nghiền nhỏ","Chất tan vào nước"],0,"Phản ứng hóa học là quá trình biến đổi chất này thành chất khác. Đổi trạng thái, nghiền nhỏ, hòa tan chỉ là biến đổi vật lí."],[0,"Phản ứng hóa học","Phản ứng đốt cháy than là phản ứng gì về mặt nhiệt?",["Tỏa nhiệt","Thu nhiệt","Không trao đổi nhiệt","Phản ứng phân hủy"],0,"Đốt cháy giải phóng nhiệt ra môi trường nên là phản ứng tỏa nhiệt."],[0,"Mol","Một mol chất chứa bao nhiêu hạt (nguyên tử hoặc phân tử)?",["6,022×10²³","6,022×10²²","3,011×10²³","1×10²³"],0,"Số Avogadro N = 6,022×10²³ hạt/mol."],[0,"Mol","Khối lượng của 0,5 mol NaCl (M = 58,5 g/mol) là?",["29,25 g","58,5 g","117 g","14,6 g"],0,"m = n × M = 0,5 × 58,5 = 29,25 g."],[0,"Nồng độ dung dịch","Hòa tan 0,2 mol NaOH vào nước được 400 mL dung dịch. Nồng độ mol là?",["0,5 M","0,08 M","2 M","0,2 M"],0,"Đổi 400 mL = 0,4 L nên C_M = n/V = 0,2/0,4 = 0,5 M."],[0,"Phương trình hóa học","Cân bằng 3Fe + ?O₂ → Fe₃O₄. Hệ số của O₂ là?",["2","1","3","4"],0,"Vế phải có 4 nguyên tử O nên cần 2O₂ ở vế trái."],[0,"Acid – Base","Dung dịch nào làm quỳ tím hóa xanh?",["NaOH","HCl","NaCl","H₂SO₄"],0,"NaOH là base (kiềm) nên làm quỳ tím hóa xanh. HCl và H₂SO₄ làm quỳ tím hóa đỏ, NaCl không đổi màu."],[0,"Acid","Kim loại nào tác dụng với dung dịch HCl giải phóng khí H₂?",["Zn","Cu","Ag","Au"],0,"Zn đứng trước H trong dãy hoạt động hóa học nên đẩy được H₂ khỏi acid. ần lỏng của máu, chứa nước, chất dinh dưỡng, hormone và chất thải."],[2,"Tuần hoàn","Đặc điểm của động mạch là gì?",["Dẫn máu từ tim đi, thành dày và đàn hồi","Dẫn máu về tim, có van","Thành rất mỏng để trao đổi chất","Luôn chứa máu nghèo oxygen"],0,"Động mạch chịu áp lực cao khi tim bơm máu nên thành dày, đàn hồi. Tĩnh mạch dẫn máu về tim và có van."],[2,"Hô hấp","Nhịp thở bình thường của người lớn lúc nghỉ ngơi khoảng bao nhiêu lần mỗi phút?",["16–20 lần","40–50 lần","5–8 lần","60–70 lần"],0,"Người lớn khỏe mạnh khi nghỉ thở khoảng 16–20 lần/phút, vận động thì nhịp thở tăng."],[2,"Bài tiết","Đơn vị chức năng của thận gồm những bộ phận nào?",["Cầu thận, nang cầu thận và ống thận","Phế nang và mao mạch","Tế bào thần kinh và sợi trục","Tiểu thùy gan và ống mật"],0,"Máu được lọc ở cầu thận, nang cầu thận chứa dịch lọc, ống thận hấp thụ lại chất cần thiết và tạo nước tiểu."],[2,"Thần kinh","Đơn vị cấu tạo của hệ thần kinh là gì?",["Neuron (tế bào thần kinh)","Hồng cầu","Tế bào cơ","Tế bào biểu bì"],0,"Neuron có thân, sợi nhánh và sợi trục, dẫn truyền xung thần kinh."],[2,"Giác quan","Tật cận thị xảy ra khi nào?",["Ảnh của vật hiện ở trước màng lưới","Ảnh của vật hiện ở sau màng lưới","Màng lưới bị hỏng","Thiếu vitamin A"],0,"Người cận thị có cầu mắt dài hoặc thể thủy tinh quá phồng nên ảnh hiện trước màng lưới, nhìn xa bị mờ."],[2,"Da","Chức năng nào sau đây KHÔNG phải của da?",["Tiêu hóa thức ăn","Bảo vệ cơ thể","Điều hòa thân nhiệt","Bài tiết mồ hôi"],0,"Da bảo vệ, cảm giác, bài tiết mồ hôi và điều hòa thân nhiệt. Tiêu hóa thức ăn là chức năng của hệ tiêu hóa."],[2,"Sinh sản","Hormone sinh dục chủ yếu của nam giới là gì?",["Testosterone","Estrogen","Insulin","Adrenaline"],0,"Tinh hoàn tiết testosterone, quyết định các đặc điểm sinh dục thứ cấp ở nam."],[2,"Chuỗi thức ăn","Chuỗi thức ăn nào sau đây viết đúng?",["Cỏ → châu chấu → ếch → rắn","Rắn → ếch → châu chấu → cỏ","Châu chấu → cỏ → ếch","Ếch → cỏ → rắn"],0,"Mũi tên chỉ chiều chuyển năng lượng: từ sinh vật sản xuất 00 kg/m³","10 000 kg/m³","1 kg/m³"],0,"Nước có D ≈ 1000 kg/m³ = 1 g/cm³."],[1,"Áp suất","Vì sao ba lô quai rộng ít đau vai hơn quai hẹp?",["Diện tích tiếp xúc lớn nên áp suất nhỏ","Ba lô nhẹ hơn","Lực ép nhỏ hơn","Quai rộng mềm hơn"],0,"Trọng lượng không đổi, quai rộng làm S lớn nên p = F/S nhỏ."],[1,"Áp suất chất lỏng","Thợ lặn ở độ sâu 20 m trong nước (d = 10 000 N/m³) chịu áp suất do nước gây ra là?",["200 000 Pa","2000 Pa","20 000 Pa","2 000 000 Pa"],0,"p = d·h = 10 000 × 20 = 200 000 Pa."],[1,"Áp suất khí quyển","Vì sao ta uống nước bằng ống hút được?",["Áp suất khí quyển đẩy nước lên khi ta hút bớt không khí trong ống","Nước tự chảy lên ống","Ống hút kéo nước lên","Nước nhẹ hơn không khí"],0,"Hút bớt khí làm áp suất trong ống nhỏ hơn bên ngoài, áp suất khí quyển đẩy nước lên miệng."],[1,"Lực đẩy Archimedes","Lực đẩy Archimedes có phương và chiều thế nào?",["Thẳng đứng, hướng lên","Thẳng đứng, hướng xuống","Nằm ngang","Tùy từng vật"],0,"Lực đẩy Archimedes luôn có phương thẳng đứng và hướng từ dưới lên."],[1,"Moment lực","Bập bênh cân bằng khi bạn 40 kg ngồi cách trục 2 m. Bạn 50 kg phải ngồi cách trục bao xa?",["1,6 m","2,5 m","2 m","1 m"],0,"40·2 = 50·d nên d = 80/50 = 1,6 m."],[1,"Mạch điện","Mạch điện đơn giản gồm những bộ phận nào?",["Nguồn điện, dây dẫn, thiết bị tiêu thụ, công tắc","Chỉ có pin","Chỉ có bóng đèn","Chỉ có dây dẫn"],0,"Mạch kín gồm nguồn điện, dây dẫn, công tắc và thiết bị dùng điện thì dòng điện mới chạy được."],[1,"Hiệu điện thế","Với các nhánh mắc song song, hiệu điện thế giữa hai đầu mỗi nhánh có đặc điểm gì?",["Bằng nhau","Bằng tổng của các nhánh","Bằng 0","Khác nhau tùy ý"],0,"Các nhánh song song cùng nối vào hai điểm chung nên hiệu điện thế giữa hai đầu mỗi nhánh bằng nhau."],[1,"Dẫn nhiệt","Chất nào sau đây dẫn nhiệt kém?",["Xốp","Nhôm","Đồng","Sắt"],0,"Xốp chứa nhiều không khí nên dẫn nhiệt kém, thường dùng làm vật cách nhiệt."],[1,"Sự nở vì nhiệt","Vì sao đường ray xe lửa phải để khe hở giữa các thanh?",["Thanh ray nở ra khi nóng, ẫn truyền xung thần kinh","Nhìn và phân biệt màu","Nghe âm thanh","Tiết hormone"],0,"Tủy sống là trung tâm của nhiều phản xạ đơn giản và đường dẫn xung giữa não và cơ thể."],[0,"Mol","Khối lượng mol của NaOH là bao nhiêu (Na = 23, O = 16, H = 1)?",["40 g/mol","39 g/mol","24 g/mol","17 g/mol"],0,"M = 23 + 16 + 1 = 40 g/mol."]];</script>
<script>
var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))};
function sh(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=R(0,k),t=a[k];a[k]=a[j];a[j]=t}return a}
var pk=function(a,n){return sh(a).slice(0,n)};
var $=function(i){return document.getElementById(i)};

/* S: [[tên phân môn, cssvar],...]; Q: [subjIdx, topic, question, options[], correctIdx, explanation] */
var S=(typeof window!=="undefined"&&window.KHTN_S)?window.KHTN_S:[];
var Q=(typeof window!=="undefined"&&window.KHTN_Q)?window.KHTN_Q:[];
var MIX=15,TOPICN=20;
function qnorm(r){var o=r[3],a=r[4],c=o[a],d=o.filter(function(_,j){return j!=a});return {q:r[2],c:c,d:d,e:r[5],topic:(S[r[0]]?S[r[0]][0]:"")+" · "+r[1]}}
function qAll(){return Q.slice()}
function qBySubj(si){return Q.filter(function(r){return r[0]==si})}
function genMix(list){return list?list.slice():pk(qAll(),MIX).map(qnorm)}
function genSubj(si,list){return list?list.slice():pk(qBySubj(si),TOPICN).map(qnorm)}

var MODE="mix",SUBJ=0,pool=[],i=0,score=0,wrong=[],done=false;

/* ===== Lịch sử làm bài (localStorage) ===== */
var HKEY="quizkhtn8_history_v1";
function loadHist(){try{var r=localStorage.getItem(HKEY);return r?JSON.parse(r):[]}catch(e){return[]}}
function saveHist(h){try{localStorage.setItem(HKEY,JSON.stringify(h))}catch(e){}}
function addHist(sc,total){
 var h=loadHist(),topic=(MODE=="mix")?"Tổng hợp (15 câu)":(S[SUBJ]?S[SUBJ][0]:"");
 h.unshift({ts:Date.now(),subject:"KHTN 8",topic:topic,score:sc,total:total});
 if(h.length>100)h=h.slice(0,100);
 saveHist(h)}
function clearHist(){saveHist([]);show()}
function fmtTime(ts){var d=new Date(ts),p=function(n){return(n<10?"0":"")+n};
 return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function histHTML(){
 var h=loadHist();
 var out='<div class="hist"><h2>Lịch sử làm bài</h2>';
 if(!h.length)return out+'<p class="hempty">Chưa có lịch sử. Hoàn thành một bộ quiz để lưu lại.</p></div>';
 out+='<table class="htbl"><thead><tr><th>Thời gian</th><th>Chủ điểm</th><th>Điểm</th></tr></thead><tbody>';
 h.forEach(function(r){out+='<tr><td>'+fmtTime(r.ts)+'</td><td>'+esc(r.subject)+' – '+esc(r.topic)+'</td><td class="sc">'+r.score+'/'+r.total+'</td></tr>'});
 out+='</tbody></table><button class="link" id="clr">Xóa toàn bộ lịch sử</button></div>';
 return out}

/* ===== Điều hướng ===== */
function setModeTabs(){$("mmix").setAttribute("aria-selected",MODE=="mix");$("mtopic").setAttribute("aria-selected",MODE=="topic")}

function goMix(list){MODE="mix";setModeTabs();$("chips").innerHTML="";
 pool=genMix(list);i=0;score=0;wrong=[];show()}

function go(si,list){MODE="topic";SUBJ=si||0;setModeTabs();$("chips").innerHTML="";
 S.forEach(function(sp,j){var b=document.createElement("button");b.className="chip";b.textContent=sp[0];b.setAttribute("aria-pressed",j==SUBJ);b.onclick=function(){go(j)};$("chips").appendChild(b)});
 pool=genSubj(SUBJ,list);i=0;score=0;wrong=[];show()}

$("mmix").onclick=function(){goMix()};
$("mtopic").onclick=function(){go(0)};

var saved=false;
function show(){
 var box=$("box");
 if(!Q.length){box.innerHTML='<div class="card"><p>Không nạp được dữ liệu KHTN 8.</p></div>';return}
 if(i>=pool.length){
  if(!saved){addHist(score,pool.length);saved=true}
  var pc=Math.round(score*100/pool.length),msg=pc>=90?"Xuất sắc!":pc>=70?"Khá tốt, ôn thêm vài câu nữa nhé.":"Hãy xem lại kiến thức rồi thử bộ mới.";
  var newLabel=MODE=="mix"?"Bộ 15 câu mới":"Bộ 20 câu mới";
  var emo=pc>=90?"🏆":pc>=70?"🎉":pc>=50?"😊":"\uD83D\uDE2D";
  box.innerHTML='<div class="card"><div class="meta">Kết quả</div><div style="font-size:3.4rem;line-height:1;margin:4px 0">'+emo+'</div><div class="big">'+score+'/'+pool.length+'</div><p>'+pc+'% đúng. '+msg+'</p><button class="btn" id="nw">'+newLabel+'</button>'+(wrong.length?'<button class="btn alt" id="rd">Ôn '+wrong.length+' câu sai</button>':'')+'</div>'+histHTML();
  $("nw").onclick=function(){MODE=="mix"?goMix():go(SUBJ)};
  if(wrong.length)$("rd").onclick=function(){MODE=="mix"?goMix(wrong.slice()):go(SUBJ,wrong.slice())};
  var c=$("clr");if(c)c.onclick=clearHist;
  return}
 saved=false;
 var q=pool[i],o=sh([{t:q.c,ok:1}].concat(q.d.map(function(t){return {t:t,ok:0}})));done=false;
 box.innerHTML='<div class="card"><div class="meta"><span>Câu '+(i+1)+'/'+pool.length+'</span><span>Đúng: '+score+'</span></div><div class="bar"><i style="width:'+(i*100/pool.length)+'%"></i></div><div class="topic" id="tp"></div><div class="q" id="qq"></div><div id="os"></div><div id="ex" hidden></div></div>';
 $("tp").textContent=q.topic||"";$("qq").textContent=q.q;
 o.forEach(function(x){var b=document.createElement("button");b.className="opt";b.textContent=x.t;b.onclick=function(){pick(b,x.ok,q,o)};$("os").appendChild(b)})}
function pick(b,ok,q,o){
 if(done)return;done=true;var bs=$("os").children;
 for(var k=0;k<bs.length;k++){bs[k].disabled=true;if(o[k].ok)bs[k].classList.add("ok")}
 if(ok)score++;else{b.classList.add("no");wrong.push(q)}
 var e=$("ex");e.hidden=false;e.className="exp";e.innerHTML='<b>'+(ok?"Chính xác!":"Chưa đúng.")+'</b> <span id="et"></span><br><button class="btn" id="nx">'+(i+1<pool.length?"Câu tiếp theo":"Xem kết quả")+'</button>';
 $("et").textContent=q.e;$("nx").onclick=function(){i++;show()};$("nx").focus()}
goMix();
</script>
</body>
</html>
