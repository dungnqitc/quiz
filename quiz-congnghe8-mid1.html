function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* ===== Trắc nghiệm ===== */
var ok,done;
function upd(){$("sc").textContent="Đúng "+ok+" / "+done+" (tổng "+MC.length+")"}
function buildMC(){
 ok=0;done=0;upd();
 var box=$("mcbox");box.innerHTML="";
 MC.forEach(function(m,i){
  var d=document.createElement("div");d.className="q";
  var p=document.createElement("p");p.className="t";p.innerHTML="<b>Câu "+(i+1)+".</b> "+esc(m[0]);d.appendChild(p);
  var bs=[];
  m[1].forEach(function(x,j){
   var b=document.createElement("button");b.className="o";b.textContent=L[j]+". "+x;
   b.onclick=function(){if(b.disabled)return;bs.forEach(function(y,k){y.disabled=true;if(k==m[2])y.classList.add("ok")});done++;if(j==m[2])ok++;else b.classList.add("no");
    if(m[3]){var e=document.createElement("div");e.className="n";e.textContent=m[3];d.appendChild(e)}upd()};
   bs.push(b);d.appendChild(b);
  });
  box.appendChild(d);
 });
 window.scrollTo(0,0);
}
$("reset").onclick=buildMC;

/* ===== Đúng/Sai ===== */
function buildTF(){
 var box=$("p1");box.innerHTML="";
 TF.forEach(function(q,i){
  var d=document.createElement("div");d.className="q";
  var p=document.createElement("p");p.className="t";p.innerHTML="<b>Câu "+(i+1)+".</b> Nhận định đúng/sai: "+esc(q[0]);d.appendChild(p);
  var rows=[];
  q[1].forEach(function(s,j){
   var r=document.createElement("div");r.className="st";
   var span=document.createElement("span");span.className="stt";span.textContent=(j+1)+". "+s[0];
   var w=document.createElement("div");w.className="tf";var bt=[];
   ["Đ","S"].forEach(function(lab,ix){
    var b=document.createElement("button");b.textContent=lab;
    b.onclick=function(){if(d.dataset.d)return;r._ans=ix===0?1:0;bt.forEach(function(x){x.classList.remove("sel")});b.classList.add("sel")};
    bt.push(b);w.appendChild(b);
   });
   r._bt=bt;r.appendChild(span);r.appendChild(w);d.appendChild(r);rows.push(r);
  });
  var c=document.createElement("button");c.className="btn pri";c.style.marginTop="8px";c.textContent="Kiểm tra";
  c.onclick=function(){
   if(d.dataset.d)return;d.dataset.d=1;var n=0;
   rows.forEach(function(r,j){var s=q[1][j];var right=s[1]?0:1;r._bt.forEach(function(x){x.classList.remove("sel")});r._bt[right].classList.add("ok");
    if(r._ans===s[1])n++;else if(r._ans!==undefined)r._bt[s[1]?1:0].classList.add("no");
    if(s[2]){var e=document.createElement("div");e.className="n";e.textContent="→ "+s[2];r.appendChild(e)}});
   var t=document.createElement("div");t.className="n";t.textContent="Đúng "+n+" / "+q[1].length+" ý";d.appendChild(t);
  };
  d.appendChild(c);box.appendChild(d);
 });
}

/* ===== Tự luận ===== */
function buildES(){
 var box=$("p2");box.innerHTML="";
 ES.forEach(function(e){
  var det=document.createElement("details");
  var sm=document.createElement("summary");sm.innerHTML=e[0];det.appendChild(sm);
  var a=document.createElement("div");a.className="ans";a.innerHTML=e[1];det.appendChild(a);
  box.appendChild(det);
 });
}

var tabs=[$("t0"),$("t1"),$("t2")];
tabs.forEach(function(t,ix){t.onclick=function(){tabs.forEach(function(x,j){x.setAttribute("aria-selected",ix===j);$("p"+j).hidden=ix!==j});window.scrollTo(0,0)}});
buildMC();buildTF();buildES();
</script>
