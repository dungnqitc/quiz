<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rắn săn mồi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
<style>
:root{--ink:#1b2a41;--paper:#fbfdff;--line:#d3e6f3;--card:#fff;--acc:#1a8f4c;--acc2:#e3f6ea;--hl:#ffe27a;--snake:#1a8f4c;--snakehd:#0b6e39;--food:#e24a4a;--mute:#5b6b7f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6eef5;--paper:#0f1d27;--line:#1c3342;--card:#162735;--acc:#5fd68a;--acc2:#13301f;--hl:#7a6a1c;--snake:#5fd68a;--snakehd:#9af0b8;--food:#ff8a80;--mute:#9fb2c4}}
:root[data-theme="dark"]{--ink:#e6eef5;--paper:#0f1d27;--line:#1c3342;--card:#162735;--acc:#5fd68a;--acc2:#13301f;--hl:#7a6a1c;--snake:#5fd68a;--snakehd:#9af0b8;--food:#ff8a80;--mute:#9fb2c4}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background-color:var(--paper);
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 4px;font-weight:800}
.sub{color:var(--mute);margin:0 0 14px;font-size:.9rem}
.link{color:var(--acc);text-decoration:underline;font-size:.95rem}
.hud{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-weight:700}
.hud .mute{color:var(--mute);font-weight:500;font-size:.9rem}
.wrap{position:relative;width:100%;aspect-ratio:1/1;max-width:420px;margin:0 auto}
canvas{width:100%;height:100%;background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--acc);touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.45);border-radius:14px;color:#fff;text-align:center;padding:16px}
.overlay h2{margin:0;font-size:1.5rem}
.btn{font:inherit;cursor:pointer;padding:11px 22px;border:2px solid var(--ink);background:var(--hl);color:#1b2a41;border-radius:10px;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;justify-content:center;margin:16px auto 0}
.pad button{font:inherit;font-size:1.3rem;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer}
.pad .sp{visibility:hidden}
.tip{color:var(--mute);font-size:.85rem;text-align:center;margin-top:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<p><a class="link" href="index.html">← Về trang chủ</a></p>
<h1>🐍 Rắn săn mồi</h1>
<p class="sub">Ăn càng nhiều mồi càng dài. Đừng đâm vào tường hay vào chính mình nhé!</p>
<div class="hud"><span>Điểm: <span id="score">0</span></span><span class="mute">Kỷ lục: <span id="best">0</span></span></div>
<div class="wrap">
<canvas id="cv" width="420" height="420"></canvas>
<div class="overlay" id="ov">
<h2 id="ovt">Sẵn sàng?</h2>
<p id="ovm">Dùng phím mũi tên / WASD, hoặc vuốt / bấm nút bên dưới.</p>
<button class="btn" id="start">Bắt đầu</button>
</div>
</div>
<div class="pad" aria-hidden="true">
<span class="sp"></span><button data-d="U">▲</button><span class="sp"></span>
<button data-d="L">◀</button><span class="sp"></span><button data-d="R">▶</button>
<span class="sp"></span><button data-d="D">▼</button><span class="sp"></span>
</div>
<p class="tip">Mẹo: rắn không thể quay ngược 180°. Ăn mồi để tăng tốc dần.</p>
</main>
<script>
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var N=21,CELL=cv.width/N;        // lưới 21x21
var snake,dir,nextDir,food,score,best,timer,speed,running;
var $=function(i){return document.getElementById(i)};
var BKEY="snake_best_v1";
best=parseInt(localStorage.getItem(BKEY)||"0",10)||0;$("best").textContent=best;

function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function placeFood(){
 var ok=false;
 while(!ok){food={x:rand(N),y:rand(N)};ok=!snake.some(function(s){return s.x==food.x&&s.y==food.y})}
}
function rand(n){return Math.floor(Math.random()*n)}

function reset(){
 snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
 dir={x:1,y:0};nextDir=dir;score=0;speed=160;placeFood();$("score").textContent=0;draw();
}
function start(){
 reset();running=true;$("ov").hidden=true;
 clearInterval(timer);timer=setInterval(tick,speed);
}
function setDir(d){
 var map={U:{x:0,y:-1},D:{x:0,y:1},L:{x:-1,y:0},R:{x:1,y:0}};
 var nd=map[d];if(!nd)return;
 if(nd.x==-dir.x&&nd.y==-dir.y)return; // không quay 180°
 nextDir=nd;
}
function tick(){
 dir=nextDir;
 var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(function(s){return s.x==head.x&&s.y==head.y})){return gameOver()}
 snake.unshift(head);
 if(head.x==food.x&&head.y==food.y){
  score++;$("score").textContent=score;placeFood();
  if(score%5==0&&speed>70){speed-=12;clearInterval(timer);timer=setInterval(tick,speed)}
 }else{snake.pop()}
 draw();
}
function draw(){
 ctx.clearRect(0,0,cv.width,cv.height);
 // mồi
 ctx.fillStyle=css("--food");
 roundRect(food.x*CELL+2,food.y*CELL+2,CELL-4,CELL-4,5);ctx.fill();
 // rắn
 for(var i=snake.length-1;i>=0;i--){
  ctx.fillStyle=i==0?css("--snakehd"):css("--snake");
  roundRect(snake[i].x*CELL+1,snake[i].y*CELL+1,CELL-2,CELL-2,5);ctx.fill();
 }
}
function roundRect(x,y,w,h,r){
 ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
 ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function gameOver(){
 running=false;clearInterval(timer);
 if(score>best){best=score;localStorage.setItem(BKEY,String(best));$("best").textContent=best}
 $("ovt").textContent="Kết thúc! Điểm: "+score;
 $("ovm").textContent=score>=best&&score>0?"Kỷ lục mới! 🎉":"Thử lại để phá kỷ lục nhé.";
 $("start").textContent="Chơi lại";$("ov").hidden=false;
}
$("start").onclick=start;

// Bàn phím
document.addEventListener("keydown",function(e){
 var k=e.key.toLowerCase(),m={arrowup:"U",w:"U",arrowdown:"D",s:"D",arrowleft:"L",a:"L",arrowright:"R",d:"R"};
 if(m[k]){e.preventDefault();if(running)setDir(m[k])}
});
// Nút cảm ứng
document.querySelectorAll(".pad button").forEach(function(b){b.onclick=function(){if(running)setDir(b.dataset.d)}});
// Vuốt
var sx,sy;
cv.addEventListener("touchstart",function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
cv.addEventListener("touchend",function(e){
 if(sx==null)return;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
 if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
 if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?"R":"L");else setDir(dy>0?"D":"U");
 sx=sy=null;
},{passive:true});

reset();
</script>
</body>
</html>
