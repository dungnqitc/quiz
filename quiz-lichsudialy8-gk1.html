var TL=(typeof window!=="undefined"&&window.LSDL_TL)?window.LSDL_TL:[];
var MIX=15,TOPICN=20;
function qnorm(r){var o=r[3],a=r[4],c=o[a],d=o.filter(function(_,j){return j!=a});return {q:r[2],c:c,d:d,e:r[5],topic:(S[r[0]]?S[r[0]][0]:"")+" · "+r[1]}}
function qAll(){return Q.slice()}
function qBySubj(si){return Q.filter(function(r){return r[0]==si})}
function genMix(list){return list?list.slice():pk(qAll(),MIX).map(qnorm)}
function genSubj(si,list){return list?list.slice():pk(qBySubj(si),TOPICN).map(qnorm)}
function subName(si){return S[si]?S[si][0]:""}

var MODE="mix",SUBJ=0,pool=[],i=0,score=0,wrong=[],wrongDetail=[],done=false;

var HKEY="quizlsdl8gk1_history_v1";
function loadHist(){try{var r=localStorage.getItem(HKEY);return r?JSON.parse(r):[]}catch(e){return[]}}
function saveHist(h){try{localStorage.setItem(HKEY,JSON.stringify(h))}catch(e){}}
function addHist(sc,total){
 var h=loadHist(),topic=(MODE=="mix")?"Tổng hợp (15 câu)":(S[SUBJ]?S[SUBJ][0]:"");
 h.unshift({ts:Date.now(),subject:"LS&ĐL 8 GK1",topic:topic,score:sc,total:total,wrong:wrongDetail.slice()});
 if(h.length>100)h=h.slice(0,100);
 saveHist(h)}
function clearHist(){saveHist([]);show()}
function fmtTime(ts){var d=new Date(ts),p=function(n){return(n<10?"0":"")+n};
 return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function histHTML(){
 var h=loadHist();
 var out='<div class="hist"><h2>Lịch sử làm bài</h2>';
 if(!h.length)return out+'<p class="hempty">Chưa có lịch sử. Hoàn thành một bộ quiz để lưu lại.</p></div>';
 out+='<table class="htbl"><thead><tr><th>Thời gian</th><th>Chủ điểm</th><th>Điểm</th></tr></thead><tbody>';
 h.forEach(function(r){out+='<tr><td>'+fmtTime(r.ts)+'</td><td>'+esc(r.subject)+' – '+esc(r.topic)+'</td><td class="sc">'+r.score+'/'+r.total+'</td></tr>'});
 out+='</tbody></table><button class="link" id="clr">Xóa toàn bộ lịch sử</button></div>';
 return out}

function goMix(list){MODE="mix";$("chips").innerHTML="";
 pool=genMix(list);i=0;score=0;wrong=[];wrongDetail=[];show()}

function go(si,list){MODE="topic";SUBJ=si||0;$("chips").innerHTML="";
 S.forEach(function(sp,j){var b=document.createElement("button");b.className="chip";b.textContent=sp[0];b.setAttribute("aria-pressed",j==SUBJ);b.onclick=function(){go(j)};$("chips").appendChild(b)});
 pool=genSubj(SUBJ,list);i=0;score=0;wrong=[];wrongDetail=[];show()}

var saved=false;
function show(){
 var box=$("box");
 if(!Q.length){box.innerHTML='<div class="card"><p>Không nạp được dữ liệu.</p></div>';return}
 if(i>=pool.length){
  if(!saved){addHist(score,pool.length);saved=true}
  var pc=Math.round(score*100/pool.length),msg=pc>=90?"Xuất sắc!":pc>=70?"Khá tốt, ôn thêm vài câu nữa nhé.":"Hãy xem lại kiến thức rồi thử bộ mới.";
  var newLabel=MODE=="mix"?"Bộ 15 câu mới":"Bộ câu mới";
  var emo=pc>=90?"🏆":pc>=70?"🎉":pc>=50?"😊":"\uD83D\uDE2D";
  box.innerHTML='<div class="card"><div class="meta">Kết quả</div><div style="font-size:3.4rem;line-height:1;margin:4px 0">'+emo+'</div><div class="big">'+score+'/'+pool.length+'</div><p>'+pc+'% đúng. '+msg+'</p><button class="btn" id="nw">'+newLabel+'</button>'+(wrong.length?'<button class="btn alt" id="rd">Ôn '+wrong.length+' câu sai</button>':'')+'</div>'+histHTML();
  $("nw").onclick=function(){MODE=="mix"?goMix():go(SUBJ)};
  if(wrong.length)$("rd").onclick=function(){MODE=="mix"?goMix(wrong.slice()):go(SUBJ,wrong.slice())};
  var c=$("clr");if(c)c.onclick=clearHist;
  return}
 saved=false;
 var q=pool[i],o=sh([{t:q.c,ok:1}].concat(q.d.map(function(t){return {t:t,ok:0}})));done=false;
 box.innerHTML='<div class="card"><div class="meta"><span>Câu '+(i+1)+'/'+pool.length+'</span><span>Đúng: '+score+'</span></div><div class="bar"><i style="width:'+(i*100/pool.length)+'%"></i></div><div class="topic" id="tp"></div><div class="q" id="qq"></div><div id="os"></div><div id="ex" hidden></div></div>';
 $("tp").textContent=q.topic||"";$("qq").textContent=q.q;
 o.forEach(function(x){var b=document.createElement("button");b.className="opt";b.textContent=x.t;b.onclick=function(){pick(b,x.ok,q,o)};$("os").appendChild(b)})}
function pick(b,ok,q,o){
 if(done)return;done=true;var bs=$("os").children;
 for(var k=0;k<bs.length;k++){bs[k].disabled=true;if(o[k].ok)bs[k].classList.add("ok")}
 if(ok)score++;else{b.classList.add("no");wrong.push(q);wrongDetail.push({q:q.q,your:b.textContent,correct:q.c})}
 var e=$("ex");e.hidden=false;e.className="exp";e.innerHTML='<b>'+(ok?"Chính xác!":"Chưa đúng.")+'</b> <span id="et"></span><br><button class="btn" id="nx">'+(i+1<pool.length?"Câu tiếp theo":"Xem kết quả")+'</button>';
 $("et").textContent=q.e;$("nx").onclick=function(){i++;show()};$("nx").focus()}

/* ===== Ôn tập & Tự luận ===== */
function renderKT(){
 var box=$("ktbox");box.innerHTML='<div class="chips" id="ktchips"></div><div id="ktlist"></div>';
 var cur="all",cw=$("ktchips");
 var filters=[["all","Tất cả"],[0,"Lịch sử"],[1,"Địa lí"]];
 function drawChips(){cw.innerHTML="";filters.forEach(function(f){var b=document.createElement("button");b.className="chip";b.textContent=f[1];b.setAttribute("aria-pressed",cur===f[0]);b.onclick=function(){cur=f[0];drawChips();drawList()};cw.appendChild(b)})}
 function drawList(){var l=$("ktlist");l.innerHTML="";
  KT.filter(function(x){return cur==="all"||x[0]===cur}).forEach(function(x){
   var items=x[2].map(function(it){return '<li>'+esc(it)+'</li>'}).join("");
   var d=document.createElement("details");
   d.innerHTML='<summary><span class="tag">'+esc(subName(x[0]))+'</span> '+esc(x[1])+'</summary><ul>'+items+'</ul>';
   l.appendChild(d)})}
 drawChips();drawList();
}

function renderTL(){
 var box=$("tlbox");box.innerHTML='<div class="chips" id="tlchips"></div><div id="tllist"></div>';
 var cur="all",cw=$("tlchips");
 var filters=[["all","Tất cả"],[0,"Lịch sử"],[1,"Địa lí"]];
 function drawChips(){cw.innerHTML="";filters.forEach(function(f){var b=document.createElement("button");b.className="chip";b.textContent=f[1];b.setAttribute("aria-pressed",cur===f[0]);b.onclick=function(){cur=f[0];drawChips();drawList()};cw.appendChild(b)})}
 function drawList(){var l=$("tllist");l.innerHTML="";
  TL.filter(function(x){return cur==="all"||x[0]===cur}).forEach(function(x){
   var c=document.createElement("div");c.className="tlcard";
   c.innerHTML='<span class="tag">'+esc(subName(x[0]))+'</span><div class="q">'+esc(x[1])+'. '+esc(x[2])+'</div>';
   var bt=document.createElement("button");bt.className="btn";bt.textContent="Xem đáp án gợi ý";
   var a=document.createElement("div");a.className="ans";a.hidden=true;a.textContent=x[3];
   bt.onclick=function(){a.hidden=!a.hidden;bt.textContent=a.hidden?"Xem đáp án gợi ý":"Ẩn đáp án"};
   c.appendChild(bt);c.appendChild(a);l.appendChild(c)})}
 drawChips();drawList();
}

function selectTab(which){
 $("mkt").setAttribute("aria-selected",which==="kt");
 $("mmix").setAttribute("aria-selected",which==="mmix");
 $("mtopic").setAttribute("aria-selected",which==="mtopic");
 $("mtl").setAttribute("aria-selected",which==="tl");
 var isQuiz=(which==="mmix"||which==="mtopic");
 $("chips").hidden=!isQuiz; $("box").hidden=!isQuiz;
 $("ktbox").hidden=which!=="kt";
 $("tlbox").hidden=which!=="tl";
}

$("mkt").onclick=function(){selectTab("kt");renderKT()};
$("mmix").onclick=function(){selectTab("mmix");goMix()};
$("mtopic").onclick=function(){selectTab("mtopic");go(0)};
$("mtl").onclick=function(){selectTab("tl");renderTL()};

selectTab("kt");
renderKT();
</script>
</body>
</html>
