['n','Công ty du lịch khảo sát món ăn ưa thích của 1500 du khách nước ngoài, kết quả như biểu đồ hình quạt. Có bao nhiêu du khách thích ăn bánh cuốn? [[d6q5]]','210',1],
['n','Quãng đường AB dài 95 km. Lúc 6 giờ một người đi xe máy từ A đến B với vận tốc 50 km/giờ; sau 30 phút giảm vận tốc còn 40 km/giờ. Người đó đến B lúc mấy giờ?','8 15|8.25',1,'8 giờ 15 phút'],
['n','Tổng số tuổi của bố và con hiện nay là 50. Ba năm trước, tuổi con bằng 2/9 tuổi bố. Tính tuổi bố hiện nay.','39',1],
['n','Cho hình chữ nhật như hình vẽ. Tính diện tích phần tô đậm (cm²). [[d6q8]]','254',1],
['h','III. Tự luận'],
['n','Bài 1. Liên đọc hết cuốn sách 375 trang trong 4 ngày. Ngày 1 đọc 1/5 tổng số trang; số trang ngày 2 bằng 5/6 ngày 3; ngày 3 gấp 1,5 lần ngày 4. a) Số trang đọc ngày 1:','75',1],
['n','b) Số trang đọc ngày thứ tư:','80',1],
['n','Bài 2. Cho hai số tự nhiên a &lt; b biết a × b × (a + b) = 30. a) Tìm a và b (gõ a rồi b).','1 5|2 3',.5,'a = 1, b = 5 hoặc a = 2, b = 3'],
['m','b) Có thể tìm được hai số tự nhiên a, b để a × b × (a + b) = 20242025 không? Vì sao?','Không thể. Nếu a hoặc b chẵn thì a × b chẵn; nếu cả hai lẻ thì a + b chẵn. Luôn có tích chẵn, mà 20242025 là số lẻ.',.5]]},

['h','Phần 1: Trắc nghiệm (mỗi câu 0,75 điểm; đề gốc không nêu phương án nên em tự điền đáp số)'],
['n','Con voi nặng 4,65 tấn. Làm tròn cân nặng đến số tự nhiên gần nhất (tấn).','5',.75],

['n','Quãng đường nhà A đến nhà B dài 800 m. Trên bản đồ tỉ lệ 1 : 20 000, quãng đường đó dài bao nhiêu cm?','4',.75],
['n','Ghép hình bên ta được một hình lập phương. Tính diện tích toàn phần của hình lập phương đó (cm²). [[d7q4]]','864',.75],
['h','Phần 2: Điền đáp số (mỗi câu 1 điểm)'],
['n','Nam tung 2 đồng xu: 2 mặt sấp 10 lần, 2 mặt ngửa 8 lần, 1 sấp 1 ngửa 17 lần. Tính tỉ số số lần 2 mặt sấp so với tổng số lần tung.','2/7|10 35',1,'2/7'],
['n','Người xuất phát lúc 7 giờ với vận tốc 30 km/giờ, đi được 45 km thì nghỉ, sau đó đi nốt 16 km với vận tốc 32 km/giờ và đến nơi lúc 9 giờ 15 phút. Thời gian nghỉ (phút):','15|0.25',1,'15 phút'],
['n','Số bi xanh của Nam ít hơn số bi đỏ 12 viên. Việt cho Nam thêm 4 viên bi xanh thì tỉ số bi xanh và bi đỏ là 3/5. Tìm số bi đỏ của Nam.','20',1],
['n','Hình thang diện tích 100 m²; kéo dài đáy lớn thêm 5 m thì diện tích tăng thêm bằng 1/5 diện tích hình thang. Tính tổng đáy lớn và đáy bé sau khi mở rộng (m).','30',1],
['h','Phần 3: Tự luận'],
['n','Câu 1. Tổ chức thiện nguyện phát quà ở 4 khu A, B, C, D. Khu A phát 50 phần, khu B phát 80% số phần của khu A. a) Cả hai khu A, B phát bao nhiêu phần quà?','90',1],
['n','b) Ở khu C phát 5/9 số quà còn lại và 5 phần quà; ở khu D phát nốt 4/5 số quà còn lại và 7 phần thì hết. Đội mang đi tất cả bao nhiêu phần quà?','180',1],
['n','Câu 2. Bộ bài có 1 thẻ ghi số 2; 2 thẻ ghi số 3; 3 thẻ ghi số 4; …; 15 thẻ ghi số 16. a) Tổng số thẻ trong bộ bài:','120',.5],

const fig=s=>s.replace(/\[\[(\w+)\]\]/g,(m,k)=>`<br><img src="${IMG[k]}" alt="Hình minh họa" style="max-width:100%;height:auto;background:#fff;border-radius:6px;margin:6px 0">`);
const r=x=>Math.round(x*100)/100;
const HKEY='dethitoan6cg_history_v1';
function saveHistory(name,score,total,wrong){
 try{var a=JSON.parse(localStorage.getItem(HKEY)||'[]');if(!Array.isArray(a))a=[];
  a.push({ts:Date.now(),topic:name,score:score,total:total,wrong:wrong});
  if(a.length>300)a=a.slice(-300);localStorage.setItem(HKEY,JSON.stringify(a));}catch(e){}
}
function build(i){let h='',k=0;E[i].it.forEach((x,j)=>{const[t,q]=x;
if(t=='h'){h+=`<h3>${q}</h3>`;k=0;return}
const lab=/^(Bài|Câu|[ab]\)|…)/.test(q)?'':`<b>${++k}.</b> `;
if(t=='c'){const p=q.split('|');h+=`<div class="q" data-j="${j}"><p>${lab}${p[0]}</p>${p.slice(1).map((o,m)=>`<label><input type="radio" name="e${i}_${j}" value="${L[m]}"> ${L[m]}. ${o}</label>`).join('')}<div class="fb"></div></div>`}
else h+=`<div class="q" data-j="${j}"><p>${lab}${fig(q)}</p>${t=='n'?`<input type="text" name="e${i}_${j}" placeholder="Đáp số" autocomplete="off">`:`<textarea rows="3" placeholder="Trình bày của em (không tự chấm, so với lời giải mẫu sau khi nộp)"></textarea>`}<div class="fb"></div></div>`});
h+=`<button class="sub" onclick="grade(${i})">Nộp bài &amp; chấm điểm</button><button class="act" onclick="build(${i});window.scrollTo(0,0)">Làm lại</button><div class="res"></div>`;
$('#p'+i).innerHTML=h}
function grade(i){const P=$('#p'+i);let s=0,mx=0,mn=0,qn=0;const wr=[];
E[i].it.forEach((x,j)=>{const[t,q,a,w,d0]=x;if(t=='h')return;const d=P.querySelector(`[data-j="${j}"]`),fb=d.querySelector('.fb');
if(t=='m'){mn+=w;fb.innerHTML='<b>Lời giải mẫu:</b> '+a;return}
mx+=w;qn++;let ok,your='';
if(t=='c'){const c=d.querySelector('input:checked');your=c?c.value:'';ok=!!c&&c.value==a;d.querySelectorAll('label').forEach(l=>{const v=l.firstElementChild.value;if(v==a)l.classList.add('ok');else if(c&&c.value==v)l.classList.add('no')});if(!ok)fb.textContent=(c?'Sai':'Chưa làm')+' — đáp án đúng: '+a}
else{const inp=d.querySelector('input'),v=inp.value;your=v.trim();ok=!!v.trim()&&a.split('|').some(z=>eq(tok(z),tok(v)));inp.classList.add(ok?'ok':'no');if(!ok)fb.textContent=(v.trim()?'Sai':'Chưa làm')+' — đáp án: '+(d0||a.split('|')[0])}
if(ok)s+=w;else{const ql=q.replace(/<[^>]+>/g,'').replace(/\[\[\w+\]\]/g,'').trim();
 wr.push({q:'Câu '+qn+'. '+(ql.length>90?ql.slice(0,90)+'…':ql),your:(your||''),correct:(t=='c'?a:(d0||a.split('|')[0]))})}});
P.querySelectorAll('input,textarea,.sub').forEach(x=>x.disabled=true);
const R=P.querySelector('.res');R.innerHTML=`<div class="score">Điểm tự động: ${r(s)}/${r(mx)}${mn?` (chưa gồm ${r(mn)} điểm phần chứng minh/giải thích – hãy đối chiếu lời giải mẫu)`:''}<br>Quy đổi thang 10: ${r(s)}/10</div>`;
saveHistory(E[i].n,r(s),r(mx),wr);
$('#t'+i).textContent=E[i].n.split(' · ')[0]+' · '+r(s);R.scrollIntoView({behavior:'smooth',block:'center'})}
E.forEach((e,i)=>{const b=document.createElement('button');b.id='t'+i;b.textContent=e.n;b.onclick=()=>show(i);$('#tabs').append(b);const d=document.createElement('div');d.id='p'+i;$('#panels').append(d);build(i)});
function show(i){E.forEach((_,j)=>{$('#p'+j).hidden=j!=i;$('#t'+j).classList.toggle('on',j==i)});window.scrollTo(0,0)}
show(0);
</script></main></body></html>
