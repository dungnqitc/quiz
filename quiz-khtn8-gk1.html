window.KHTN_TL=[
[0,"Câu 21 (Vật lí)","Bình chia độ chứa nước, ban đầu mực nước ngang vạch 100 cm³. Thả chìm quả cầu đặc bằng sắt, mực nước dâng lên vạch 180 cm³. Biết D sắt = 7800 kg/m³. Tính khối lượng quả cầu.","V = 180 − 100 = 80 cm³ = 80·10⁻⁶ m³\nm = D·V = 7800 × 80·10⁻⁶ = 0,624 kg (624 g)"],
[0,"Câu 22 (Vật lí)","Tủ lạnh gây áp suất 1500 Pa lên sàn, diện tích tiếp xúc 50 dm². Tính khối lượng tủ lạnh.","S = 50 dm² = 0,5 m²\nF = p·S = 1500 × 0,5 = 750 N\nm = F/10 = 75 kg"],
[0,"Câu 23 (Vật lí)","Người nặng 60 kg vác thùng hàng nặng 120 N, đứng yên trên sàn. Diện tích tiếp xúc mỗi bàn chân 200 cm². Tính áp lực và áp suất lên sàn.","Áp lực F = 600 + 120 = 720 N\nS = 2 × 200 = 400 cm² = 0,04 m²\np = F/S = 720 / 0,04 = 18000 Pa"],
[0,"Câu 24 (Vật lí)","Bao gạo 55 kg đặt trên bàn 5 kg có 4 chân, diện tích mỗi chân 2 cm². a) Tính áp lực lên mặt đất. b) Tính áp suất của các chân bàn lên mặt đất.","a) F = P = 10 × (55 + 5) = 600 N\nb) S = 4 × 2 = 8 cm² = 8·10⁻⁴ m²\np = 600 / 8·10⁻⁴ = 750000 Pa"],
[0,"Câu 25 (Vật lí)","Xe container nặng 26000 N, diện tích tiếp xúc với mặt đường 130 dm². So sánh áp suất với người nặng 45 kg, diện tích tiếp xúc 2 bàn chân 200 cm².","Xe: S = 1,3 m²; p₁ = 26000 / 1,3 = 20000 Pa\nNgười: F = 450 N; S = 0,02 m²; p₂ = 450 / 0,02 = 22500 Pa\nVậy p₂ > p₁ (áp suất của người lớn hơn xe)."],
[1,"Câu 24 (Hóa học) – a, b, c, d","a) Số mol phân tử KNO₃ trong 20,2 g. b) Số phân tử KOH trong 8 g. c) Thể tích 1,5 mol khí ở 25 °C, 1 bar. d) Thể tích O₂ của 64 g O₂ ở điều kiện chuẩn.","a) M(KNO₃) = 101 → n = 20,2/101 = 0,2 mol\nb) n = 8/56 ≈ 0,143 mol → số phân tử ≈ 0,143 × 6,022·10²³ ≈ 8,6·10²²\nc) V = 1,5 × 24,79 = 37,185 L\nd) n = 64/32 = 2 mol → V = 2 × 24,79 = 49,58 L"],
[1,"Câu 24 (Hóa học) – e, f, g, h","e) Số mol khí trong bình 743,7 mL ở 25 °C, 1 bar. f) Khí X có tỉ khối so với O₂ bằng 1,375, tính khối lượng mol X. g) Khối lượng 0,5 mol Fe(OH)₃. h) Khối lượng 12,395 L CO₂ ở đkc.","e) n = 0,7437 / 24,79 = 0,03 mol\nf) M(X) = 1,375 × 32 = 44 g/mol\ng) M(Fe(OH)₃) = 107 → m = 0,5 × 107 = 53,5 g\nh) n = 12,395 / 24,79 = 0,5 mol → m = 0,5 × 44 = 22 g"],
[1,"Câu 24 (Hóa học) – i, k, l","i) Hỗn hợp X gồm H₂ và CO₂, d(X/H₂) = 12: tính khối lượng mol trung bình. k) Khí X nặng 7,1 g, thể tích 4,958 L (đkc): tính khối lượng mol X. l) Hỗn hợp O₂ và CO₂ nặng 20,8 g, tổng 0,5 mol: tìm số mol mỗi khí.","i) M(X) = 12 × 2 = 24 g/mol\nk) n = 4,958 / 24,79 = 0,2 mol → M = 7,1 / 0,2 = 35,5 g/mol (khí Cl₂)\nl) Gọi x = n(O₂), y = n(CO₂): x + y = 0,5; 32x + 44y = 20,8\n→ y = 0,4 mol; x = 0,1 mol"],
[1,"Câu 25 (Hóa học)","a) Hòa tan 11,7 g NaCl thành 1,25 lít dung dịch: CM? b) 14,9 g KCl thành 2 lít: CM? c) 74 g H₂SO₄ trong 200 g dung dịch: C%? d) 28 g HNO₃ trong 200 g dung dịch: C%? e) Pha 800 g nước muối sinh lí NaCl 0,9%: khối lượng NaCl và nước?","a) n = 11,7/58,5 = 0,2 mol → CM = 0,2/1,25 = 0,16 M\nb) n = 14,9/74,5 = 0,2 mol → CM = 0,2/2 = 0,1 M\nc) C% = 74/200 × 100% = 37%\nd) C% = 28/200 × 100% = 14%\ne) m NaCl = 800 × 0,9% = 7,2 g; m nước = 800 − 7,2 = 792,8 g"],
[1,"Câu 26 (Hóa học)","1. Ở 25 °C độ tan AgNO₃ là 222 g. a) Tính C% dung dịch bão hòa. b) Pha 50 g dung dịch bão hòa cần bao nhiêu g AgNO₃ và g nước? 2. a) Cần thêm bao nhiêu g Na₂SO₄ vào 50 mL dung dịch Na₂SO₄ 0,5 M để được 1 M? b) Cần thêm bao nhiêu g KOH vào 75 g dung dịch KOH 10% để được 32,5%?","1a) C% = 222/(222 + 100) × 100% ≈ 68,94%\n1b) m AgNO₃ = 50 × 68,94% ≈ 34,47 g; m nước = 50 − 34,47 ≈ 15,53 g\n2a) n ban đầu = 0,5 × 0,05 = 0,025 mol; n cần = 1 × 0,05 = 0,05 mol\n   Thêm 0,025 mol × 142 = 3,55 g Na₂SO₄\n2b) m KOH ban đầu = 7,5 g. Thêm x g: (7,5 + x)/(75 + x) = 0,325\n   → 0,675x = 16,875 → x = 25 g KOH"],
[2,"Câu 21 (Sinh học)","Nêu nguyên nhân, biểu hiện và cách phòng tránh tật cong vẹo cột sống và bệnh loãng xương.","Cong vẹo cột sống:\n- Nguyên nhân: tư thế hoạt động không đúng trong thời gian dài, mang vác vật nặng thường xuyên, do tai nạn hay còi xương.\n- Biểu hiện: cột sống không bình thường, các đốt sống bị xoay lệch về một bên, cong quá mức về phía trước hay phía sau.\n- Phòng tránh: duy trì tư thế đúng; tránh mang vác nặng sai cách; tập thể dục thường xuyên; chế độ dinh dưỡng hợp lí.\n\nLoãng xương:\n- Nguyên nhân: thiếu Ca và P nên mật độ chất khoáng trong xương thưa dần.\n- Biểu hiện: khi bị chấn thương, người mắc bệnh có nguy cơ gãy xương cao hơn người không mắc bệnh.\n- Phòng tránh: bổ sung canxi, vitamin D, vận động thường xuyên, phơi nắng sáng sớm."],
[2,"Câu 22 (Sinh học)","Trình bày quá trình tiêu hóa thức ăn trong khoang miệng. Nguyên nhân, biểu hiện và cách phòng tránh bệnh viêm loét dạ dày – tá tràng.","Tiêu hóa ở khoang miệng:\n- Biến đổi cơ học: răng nghiền, cắt, xé; lưỡi đảo trộn; thức ăn được làm ẩm và nhào trộn với nước bọt.\n- Biến đổi hóa học: enzyme amylase trong nước bọt biến đổi một phần tinh bột chín thành đường maltose.\n\nViêm loét dạ dày – tá tràng:\n- Nguyên nhân: vi khuẩn H. pylori, ăn uống không đúng giờ, ăn cay nóng, rượu bia, căng thẳng kéo dài.\n- Biểu hiện: đau vùng thượng vị, ợ chua, buồn nôn, đầy bụng.\n- Phòng tránh: ăn uống điều độ, vệ sinh an toàn thực phẩm, hạn chế rượu bia và đồ cay, giữ tinh thần thoải mái, khám khi có triệu chứng."]

<script>
var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))};
function sh(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=R(0,k),t=a[k];a[k]=a[j];a[j]=t}return a}
var pk=function(a,n){return sh(a).slice(0,n)};
var $=function(i){return document.getElementById(i)};

var S=(typeof window!=="undefined"&&window.KHTN_S)?window.KHTN_S:[];
var Q=(typeof window!=="undefined"&&window.KHTN_Q)?window.KHTN_Q:[];
var MIX=15,TOPICN=20;
function qnorm(r){var o=r[3],a=r[4],c=o[a],d=o.filter(function(_,j){return j!=a});return {q:r[2],c:c,d:d,e:r[5],topic:(S[r[0]]?S[r[0]][0]:"")+" · "+r[1]}}
function qAll(){return Q.slice()}
function qBySubj(si){return Q.filter(function(r){return r[0]==si})}
function genMix(list){return list?list.slice():pk(qAll(),MIX).map(qnorm)}
function genSubj(si,list){return list?list.slice():pk(qBySubj(si),TOPICN).map(qnorm)}

var MODE="mix",SUBJ=0,pool=[],i=0,score=0,wrong=[],wrongDetail=[],done=false;

var HKEY="quizkhtn8gk1_history_v1";
function loadHist(){try{var r=localStorage.getItem(HKEY);return r?JSON.parse(r):[]}catch(e){return[]}}
function saveHist(h){try{localStorage.setItem(HKEY,JSON.stringify(h))}catch(e){}}
function addHist(sc,total){
 var h=loadHist(),topic=(MODE=="mix")?"Tổng hợp (15 câu)":(S[SUBJ]?S[SUBJ][0]:"");
 h.unshift({ts:Date.now(),subject:"KHTN 8 GK1",topic:topic,score:sc,total:total,wrong:wrongDetail.slice()});
 if(h.length>100)h=h.slice(0,100);
 saveHist(h)}
function clearHist(){saveHist([]);show()}
function fmtTime(ts){var d=new Date(ts),p=function(n){return(n<10?"0":"")+n};
 return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function histHTML(){
 var h=loadHist();
 var out='<div class="hist"><h2>Lịch sử làm bài</h2>';
 if(!h.length)return out+'<p class="hempty">Chưa có lịch sử. Hoàn thành một bộ quiz để lưu lại.</p></div>';
 out+='<table class="htbl"><thead><tr><th>Thời gian</th><th>Chủ điểm</th><th>Điểm</th></tr></thead><tbody>';
 h.forEach(function(r){out+='<tr><td>'+fmtTime(r.ts)+'</td><td>'+esc(r.subject)+' – '+esc(r.topic)+'</td><td class="sc">'+r.score+'/'+r.total+'</td></tr>'});
 out+='</tbody></table><button class="link" id="clr">Xóa toàn bộ lịch sử</button></div>';
 return out}

function setModeTabs(){$("mmix").setAttribute("aria-selected",MODE=="mix");$("mtopic").setAttribute("aria-selected",MODE=="topic")}

function goMix(list){MODE="mix";setModeTabs();$("chips").innerHTML="";
 pool=genMix(list);i=0;score=0;wrong=[];wrongDetail=[];show()}

function go(si,list){MODE="topic";SUBJ=si||0;setModeTabs();$("chips").innerHTML="";
 S.forEach(function(sp,j){var b=document.createElement("button");b.className="chip";b.textContent=sp[0];b.setAttribute("aria-pressed",j==SUBJ);b.onclick=function(){go(j)};$("chips").appendChild(b)});
 pool=genSubj(SUBJ,list);i=0;score=0;wrong=[];wrongDetail=[];show()}

var saved=false;
function show(){
 var box=$("box");
 if(!Q.length){box.innerHTML='<div class="card"><p>Không nạp được dữ liệu KHTN 8 GK1.</p></div>';return}
 if(i>=pool.length){
  if(!saved){addHist(score,pool.length);saved=true}
  var pc=Math.round(score*100/pool.length),msg=pc>=90?"Xuất sắc!":pc>=70?"Khá tốt, ôn thêm vài câu nữa nhé.":"Hãy xem lại kiến thức rồi thử bộ mới.";
  var newLabel=MODE=="mix"?"Bộ 15 câu mới":"Bộ câu mới";
  var emo=pc>=90?"🏆":pc>=70?"🎉":pc>=50?"😊":"\uD83D\uDE2D";
  box.innerHTML='<div class="card"><div class="meta">Kết quả</div><div style="font-size:3.4rem;line-height:1;margin:4px 0">'+emo+'</div><div class="big">'+score+'/'+pool.length+'</div><p>'+pc+'% đúng. '+msg+'</p><button class="btn" id="nw">'+newLabel+'</button>'+(wrong.length?'<button class="btn alt" id="rd">Ôn '+wrong.length+' câu sai</button>':'')+'</div>'+histHTML();
  $("nw").onclick=function(){MODE=="mix"?goMix():go(SUBJ)};
  if(wrong.length)$("rd").onclick=function(){MODE=="mix"?goMix(wrong.slice()):go(SUBJ,wrong.slice())};
  var c=$("clr");if(c)c.onclick=clearHist;
  return}
 saved=false;
 var q=pool[i],o=sh([{t:q.c,ok:1}].concat(q.d.map(function(t){return {t:t,ok:0}})));done=false;
 box.innerHTML='<div class="card"><div class="meta"><span>Câu '+(i+1)+'/'+pool.length+'</span><span>Đúng: '+score+'</span></div><div class="bar"><i style="width:'+(i*100/pool.length)+'%"></i></div><div class="topic" id="tp"></div><div class="q" id="qq"></div><div id="os"></div><div id="ex" hidden></div></div>';
 $("tp").textContent=q.topic||"";$("qq").textContent=q.q;
 o.forEach(function(x){var b=document.createElement("button");b.className="opt";b.textContent=x.t;b.onclick=function(){pick(b,x.ok,q,o)};$("os").appendChild(b)})}
function pick(b,ok,q,o){
 if(done)return;done=true;var bs=$("os").children;
 for(var k=0;k<bs.length;k++){bs[k].disabled=true;if(o[k].ok)bs[k].classList.add("ok")}
 if(ok)score++;else{b.classList.add("no");wrong.push(q);wrongDetail.push({q:q.q,your:b.textContent,correct:q.c})}
 var e=$("ex");e.hidden=false;e.className="exp";e.innerHTML='<b>'+(ok?"Chính xác!":"Chưa đúng.")+'</b> <span id="et"></span><br><button class="btn" id="nx">'+(i+1<pool.length?"Câu tiếp theo":"Xem kết quả")+'</button>';
 $("et").textContent=q.e;$("nx").onclick=function(){i++;show()};$("nx").focus()}

/* ===== Tab cấp cao: Quiz / Ôn tập / Tự luận ===== */
var KT=(typeof window!=="undefined"&&window.KHTN_KT)?window.KHTN_KT:[];
var TL=(typeof window!=="undefined"&&window.KHTN_TL)?window.KHTN_TL:[];
function subName(si){return S[si]?S[si][0]:""}

function renderKT(){
 var box=$("ktbox");
 box.innerHTML='<div class="chips" id="ktchips"></div><div id="ktlist"></div>';
 var cur="all";
 var filters=[["all","Tất cả"],[0,"Vật lí"],[1,"Hóa học"],[2,"Sinh học"]];
 var cw=$("ktchips");
 function drawChips(){cw.innerHTML="";filters.forEach(function(f){var b=document.createElement("button");b.className="chip";b.textContent=f[1];b.setAttribute("aria-pressed",cur===f[0]);b.onclick=function(){cur=f[0];drawChips();drawList()};cw.appendChild(b)})}
 function drawList(){var l=$("ktlist");l.innerHTML="";
  KT.filter(function(x){return cur==="all"||x[0]===cur}).forEach(function(x){
   var items=x[2].map(function(it){return '<li>'+esc(it)+'</li>'}).join("");
   var d=document.createElement("details");
   d.innerHTML='<summary><span class="tag">'+esc(subName(x[0]))+'</span> '+esc(x[1])+'</summary><ul>'+items+'</ul>';
   l.appendChild(d)})}
 drawChips();drawList();
}

function renderTL(){
 var box=$("tlbox");
 box.innerHTML='<div class="chips" id="tlchips"></div><div id="tllist"></div>';
 var cur="all";
 var filters=[["all","Tất cả"],[0,"Vật lí"],[1,"Hóa học"],[2,"Sinh học"]];
 var cw=$("tlchips");
 function drawChips(){cw.innerHTML="";filters.forEach(function(f){var b=document.createElement("button");b.className="chip";b.textContent=f[1];b.setAttribute("aria-pressed",cur===f[0]);b.onclick=function(){cur=f[0];drawChips();drawList()};cw.appendChild(b)})}
 function drawList(){var l=$("tllist");l.innerHTML="";
  TL.filter(function(x){return cur==="all"||x[0]===cur}).forEach(function(x){
   var c=document.createElement("div");c.className="tlcard";
   c.innerHTML='<span class="tag">'+esc(subName(x[0]))+'</span><div class="q">'+esc(x[1])+'</div><div class="de">'+esc(x[2])+'</div>';
   var bt=document.createElement("button");bt.className="btn";bt.textContent="Xem đáp án gợi ý";
   var a=document.createElement("div");a.className="ans";a.hidden=true;a.textContent=x[3];
   bt.onclick=function(){a.hidden=!a.hidden;bt.textContent=a.hidden?"Xem đáp án gợi ý":"Ẩn đáp án"};
   c.appendChild(bt);c.appendChild(a);l.appendChild(c)})}
 drawChips();drawList();
}

function selectTab(which){
 var tabs={quiz:["mmix","mtopic"],kt:["mkt"],tl:["mtl"]};
 $("mmix").setAttribute("aria-selected",which==="mmix");
 $("mtopic").setAttribute("aria-selected",which==="mtopic");
 $("mkt").setAttribute("aria-selected",which==="kt");
 $("mtl").setAttribute("aria-selected",which==="tl");
 var isQuiz=(which==="mmix"||which==="mtopic");
 $("chips").hidden=!isQuiz; $("box").hidden=!isQuiz;
 $("ktbox").hidden=which!=="kt";
 $("tlbox").hidden=which!=="tl";
}

$("mmix").onclick=function(){selectTab("mmix");goMix()};
$("mtopic").onclick=function(){selectTab("mtopic");go(0)};
$("mkt").onclick=function(){selectTab("kt");renderKT()};
$("mtl").onclick=function(){selectTab("tl");renderTL()};

selectTab("kt");
renderKT();
</script>
