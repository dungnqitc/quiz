function gen(s,k){var g=(s=="t"?TG:VG)[k],seen={},out=[],n=0;
 function add(q){if(!q)return;var key=q.q+"|"+q.c+"|"+q.d.slice().sort().join();if(seen[key])return;seen[key]=1;out.push(q)}
 if(s=="v")FX[k].forEach(function(x){add(M(x[0],x[1],x[2],x[3]))});
 while(out.length<100&&n++<5000)add(P(g)());
 return out}

/* Quiz tổng hợp: chọn môn, mỗi môn 25 câu ngẫu nhiên từ toàn bộ kho của môn đó */
var MIXPER=25;
function subjGens(s){var g=[],bank=s=="t"?TG:VG;for(var k in bank)bank[k].forEach(function(fn){g.push(fn)});return g}
function genSubjN(s,n){var gens=subjGens(s),seen={},out=[],c=0;
 while(out.length<n&&c++<5000){var q=P(gens)();if(!q)continue;var key=q.q+"|"+q.c+"|"+q.d.slice().sort().join();if(seen[key])continue;seen[key]=1;out.push(q)}
 return out}

var $=function(i){return document.getElementById(i)};
var S="t",K=1,pool=[],i=0,score=0,wrong=[],done=false;

/* ===== Lịch sử làm bài (localStorage) ===== */
var HKEY="quiz5_history_v1";
function loadHist(){try{var r=localStorage.getItem(HKEY);return r?JSON.parse(r):[]}catch(e){return[]}}
function saveHist(h){try{localStorage.setItem(HKEY,JSON.stringify(h))}catch(e){}}
function subjName(s){return s=="t"?"Toán":"Tiếng Việt"}
function addHist(sc,total){
 var h=loadHist(),subject,topic;
 if(MODE=="mix"){subject="Tổng hợp";topic=subjName(S)+" (25 câu)"}
 else{subject=subjName(S);topic=NM[S][K-1]}
 h.unshift({ts:Date.now(),subject:subject,topic:topic,score:sc,total:total});
 if(h.length>100)h=h.slice(0,100);
 saveHist(h)}
function clearHist(){saveHist([]);show()}
function fmtTime(ts){var d=new Date(ts),p=function(n){return(n<10?"0":"")+n};
 return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function histHTML(){
 var h=loadHist();
 var out='<div class="hist"><h2>Lịch sử làm bài</h2>';
 if(!h.length)return out+'<p class="hempty">Chưa có lịch sử. Hoàn thành một bộ quiz để lưu lại.</p></div>';
 out+='<table class="htbl"><thead><tr><th>Thời gian</th><th>Môn &amp; chủ điểm</th><th>Điểm</th></tr></thead><tbody>';
 h.forEach(function(r){out+='<tr><td>'+fmtTime(r.ts)+'</td><td>'+esc(r.subject)+' – '+esc(r.topic)+'</td><td class="sc">'+r.score+'/'+r.total+'</td></tr>'});
 out+='</tbody></table><button class="link" id="clr">Xóa toàn bộ lịch sử</button></div>';
 return out}

/* ===== Điều hướng chế độ & chủ đề ===== */
var MODE="mix";

function setModeTabs(){$("mmix").setAttribute("aria-selected",MODE=="mix");$("mtopic").setAttribute("aria-selected",MODE=="topic");
 $("subjtabs").hidden=(MODE!="topic");$("chips").hidden=false}

/* Chế độ tổng hợp: chọn môn, mỗi môn 25 câu ngẫu nhiên */
function goMix(s,list){MODE="mix";S=s||"t";setModeTabs();document.body.setAttribute("data-s",S);
 $("chips").innerHTML="";
 [["t","Toán (25 câu)"],["v","Tiếng Việt (25 câu)"]].forEach(function(it){var b=document.createElement("button");b.className="chip";b.textContent=it[1];b.setAttribute("aria-pressed",it[0]==S);b.onclick=function(){goMix(it[0])};$("chips").appendChild(b)});
 pool=list||genSubjN(S,MIXPER);i=0;score=0;wrong=[];show()}

/* Chế độ theo chủ đề */
function go(s,k,list){MODE="topic";S=s;K=k;setModeTabs();document.body.setAttribute("data-s",s);
 $("tt").setAttribute("aria-selected",s=="t");$("tv").setAttribute("aria-selected",s=="v");
 $("chips").innerHTML="";
 NM[s].forEach(function(n,j){var b=document.createElement("button");b.className="chip";b.textContent=n;b.setAttribute("aria-pressed",j+1==k);b.onclick=function(){go(s,j+1)};$("chips").appendChild(b)});
 pool=list||gen(s,k);i=0;score=0;wrong=[];show()}

$("mmix").onclick=function(){goMix("t")};
$("mtopic").onclick=function(){go("t",1)};
$("tt").onclick=function(){go("t",1)};$("tv").onclick=function(){go("v",1)};

var saved=false;
function show(){
 var box=$("box");
 if(i>=pool.length){
  if(!saved){addHist(score,pool.length);saved=true}
  var pc=Math.round(score*100/pool.length),msg=pc>=90?"Xuất sắc!":pc>=70?"Khá tốt, ôn thêm vài câu nữa nhé.":"Hãy xem lại kiến thức rồi thử bộ mới.";
  var newLabel=MODE=="mix"?"Bộ 25 câu mới":"Bộ 100 câu mới";
  box.innerHTML='<div class="card"><div class="meta">Kết quả</div><div class="big">'+score+'/'+pool.length+'</div><p>'+pc+'% đúng. '+msg+'</p><button class="btn" id="nw">'+newLabel+'</button>'+(wrong.length?'<button class="btn alt" id="rd">Ôn '+wrong.length+' câu sai</button>':'')+'</div>'+histHTML();
  $("nw").onclick=function(){MODE=="mix"?goMix(S):go(S,K)};
  if(wrong.length)$("rd").onclick=function(){MODE=="mix"?goMix(S,wrong.slice()):go(S,K,wrong.slice())};
  var c=$("clr");if(c)c.onclick=clearHist;
  return}
 saved=false;
 var q=pool[i],o=sh([{t:q.c,ok:1}].concat(q.d.map(function(t){return {t:t,ok:0}})));done=false;
 box.innerHTML='<div class="card"><div class="meta"><span>Câu '+(i+1)+'/'+pool.length+'</span><span>Đúng: '+score+'</span></div><div class="bar"><i style="width:'+(i*100/pool.length)+'%"></i></div><div class="q" id="qq"></div><div id="os"></div><div id="ex" hidden></div></div>';
 $("qq").textContent=q.q;
 o.forEach(function(x){var b=document.createElement("button");b.className="opt";b.textContent=x.t;b.onclick=function(){pick(b,x.ok,q,o)};$("os").appendChild(b)})}
function pick(b,ok,q,o){
 if(done)return;done=true;var bs=$("os").children;
 for(var k=0;k<bs.length;k++){bs[k].disabled=true;if(o[k].ok)bs[k].classList.add("ok")}
 if(ok)score++;else{b.classList.add("no");wrong.push(q)}
 var e=$("ex");e.hidden=false;e.className="exp";e.innerHTML='<b>'+(ok?"Chính xác!":"Chưa đúng.")+'</b> <span id="et"></span><br><button class="btn" id="nx">'+(i+1<pool.length?"Câu tiếp theo":"Xem kết quả")+'</button>';
 $("et").textContent=q.e;$("nx").onclick=function(){i++;show()};$("nx").focus()}
goMix("t");
</script>
</body>
</html>
