<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lật thẻ ghi nhớ – Từ vựng tiếng Anh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
<style>
:root{--ink:#1b2a41;--paper:#fbfdff;--line:#d3e6f3;--card:#fff;--acc:#b3263e;--acc2:#fbeaec;--hl:#ffe27a;--ok:#1a8f4c;--okb:#e3f6ea;--mute:#5b6b7f;--back:#b3263e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6eef5;--paper:#0f1d27;--line:#1c3342;--card:#162735;--acc:#ff8fa3;--acc2:#3a1f27;--hl:#7a6a1c;--ok:#5fd68a;--okb:#13301f;--mute:#9fb2c4;--back:#7a2436}}
:root[data-theme="dark"]{--ink:#e6eef5;--paper:#0f1d27;--line:#1c3342;--card:#162735;--acc:#ff8fa3;--acc2:#3a1f27;--hl:#7a6a1c;--ok:#5fd68a;--okb:#13301f;--mute:#9fb2c4;--back:#7a2436}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background-color:var(--paper);
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 4px;font-weight:800}
.sub{color:var(--mute);margin:0 0 14px;font-size:.9rem}
.link{color:var(--acc);text-decoration:underline;font-size:.95rem}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;font:inherit;cursor:pointer;padding:9px;border:2px solid var(--ink);background:var(--card);color:inherit;border-radius:10px;font-weight:700;font-size:.92rem}
.tab[aria-selected=true]{background:var(--hl);color:#1b2a41}
.hud{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px;font-weight:700;flex-wrap:wrap;gap:6px}
.hud .mute{color:var(--mute);font-weight:500;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cardx{position:relative;aspect-ratio:3/4;perspective:600px;cursor:pointer}
.inner{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.cardx.flip .inner,.cardx.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-weight:700;border:2px solid var(--ink)}
.front{background:var(--back);color:#fff;font-size:1.6rem}
.back{background:var(--card);color:var(--ink);transform:rotateY(180deg);font-size:.82rem;line-height:1.25}
.cardx.done .back{background:var(--okb);border-color:var(--ok)}
.cardx.en .back{font-weight:800;font-size:.95rem}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
.btn{font:inherit;cursor:pointer;margin-top:16px;padding:11px 22px;border:2px solid var(--ink);background:var(--hl);color:#1b2a41;border-radius:10px;font-weight:700}
.win{margin-top:16px;padding:14px;border:2px solid var(--ink);border-radius:12px;background:var(--acc2);text-align:center;font-weight:700}
.tip{color:var(--mute);font-size:.85rem;margin-top:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<p><a class="link" href="index.html">← Về trang chủ</a></p>
<h1>🧠 Lật thẻ ghi nhớ – Từ vựng tiếng Anh</h1>
<p class="sub">Lật thẻ tìm cặp <b>từ tiếng Anh</b> khớp với <b>nghĩa tiếng Việt</b>. Mỗi ván 8 cặp (16 thẻ).</p>
<div class="tabs">
<button class="tab" id="lv1" aria-selected="true">Tiểu học</button>
<button class="tab" id="lv2" aria-selected="false">THCS</button>
<button class="tab" id="lv3" aria-selected="false">THPT</button>
</div>
<div class="hud"><span>Lượt lật: <span id="moves">0</span></span><span>Cặp: <span id="pairs">0</span>/8</span><span class="mute">Kỷ lục: <span id="best">—</span></span></div>
<div class="grid" id="grid"></div>
<div id="win" hidden></div>
<button class="btn" id="again">Ván mới</button>
<p class="tip">Mẹo: ghi nhớ vị trí thẻ đã lật. Hoàn thành với càng ít lượt càng tốt để lập kỷ lục!</p>
</main>
<script>
/* Bộ từ vựng tiếng Anh thông dụng theo cấp (biên soạn, không phải danh mục chính thức).
   Mỗi phần tử: [từ tiếng Anh, nghĩa tiếng Việt] */
var VOCAB={
 lv1:[["cat","con mèo"],["dog","con chó"],["book","quyển sách"],["pen","cái bút"],["red","màu đỏ"],["blue","màu xanh dương"],["apple","quả táo"],["milk","sữa"],["fish","con cá"],["bird","con chim"],["house","ngôi nhà"],["tree","cái cây"],["sun","mặt trời"],["rain","mưa"],["hand","bàn tay"],["eye","con mắt"],["one","số một"],["two","số hai"],["school","trường học"],["teacher","giáo viên"],["ball","quả bóng"],["egg","quả trứng"],["rice","cơm/gạo"],["water","nước"]],
 lv2:[["family","gia đình"],["weather","thời tiết"],["holiday","kỳ nghỉ"],["hospital","bệnh viện"],["library","thư viện"],["dangerous","nguy hiểm"],["beautiful","đẹp"],["difficult","khó"],["important","quan trọng"],["travel","du lịch/đi lại"],["festival","lễ hội"],["environment","môi trường"],["language","ngôn ngữ"],["homework","bài tập về nhà"],["exercise","bài tập/tập thể dục"],["invent","phát minh"],["pollution","ô nhiễm"],["recycle","tái chế"],["volunteer","tình nguyện"],["culture","văn hóa"],["history","lịch sử"],["science","khoa học"],["machine","máy móc"],["future","tương lai"]],
 lv3:[["achieve","đạt được"],["opportunity","cơ hội"],["develop","phát triển"],["environmentally","thuộc về môi trường"],["sustainable","bền vững"],["technology","công nghệ"],["experience","kinh nghiệm/trải nghiệm"],["government","chính phủ"],["education","giáo dục"],["economy","kinh tế"],["influence","ảnh hưởng"],["responsibility","trách nhiệm"],["communicate","giao tiếp"],["independent","độc lập"],["generation","thế hệ"],["advertisement","quảng cáo"],["population","dân số"],["employment","việc làm"],["knowledge","kiến thức"],["solution","giải pháp"],["global","toàn cầu"],["improve","cải thiện"],["available","có sẵn"],["significant","đáng kể"]]
};

var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))};
function sh(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=R(0,k),t=a[k];a[k]=a[j];a[j]=t}return a}
var $=function(i){return document.getElementById(i)};

var PAIRS=8,level="lv1",deck=[],first=null,lock=false,moves=0,matched=0;

function bestKey(){return "memory_best_"+level}
function loadBest(){var v=localStorage.getItem(bestKey());return v?parseInt(v,10):null}
function saveBest(m){var b=loadBest();if(b===null||m<b){localStorage.setItem(bestKey(),String(m));}}
function showBest(){var b=loadBest();$("best").textContent=(b===null?"—":b+" lượt")}

function setLevel(lv){level=lv;["lv1","lv2","lv3"].forEach(function(k){$(k).setAttribute("aria-selected",k==lv)});showBest();newGame()}

function newGame(){
 moves=0;matched=0;first=null;lock=false;
 $("moves").textContent=0;$("pairs").textContent=0;$("win").hidden=true;
 var picks=sh(VOCAB[level]).slice(0,PAIRS); // 8 cặp
 var cards=[];
 picks.forEach(function(p,idx){
  cards.push({pair:idx,type:"en",text:p[0]});
  cards.push({pair:idx,type:"vi",text:p[1]});
 });
 deck=sh(cards);
 var g=$("grid");g.innerHTML="";
 deck.forEach(function(c,i){
  var el=document.createElement("div");el.className="cardx"+(c.type=="en"?" en":"");el.dataset.i=i;
  el.innerHTML='<div class="inner"><div class="face front">?</div><div class="face back"></div></div>';
  el.querySelector(".back").textContent=c.text;
  el.onclick=function(){flip(el,i)};
  g.appendChild(el);
 });
}

function flip(el,i){
 if(lock||el.classList.contains("flip")||el.classList.contains("done"))return;
 el.classList.add("flip");
 if(first===null){first={el:el,i:i};return}
 // lượt lật thứ hai
 moves++;$("moves").textContent=moves;lock=true;
 var a=deck[first.i],b=deck[i];
 if(a.pair===b.pair&&first.i!==i){
  setTimeout(function(){
   first.el.classList.add("done");el.classList.add("done");
   first.el.classList.remove("flip");el.classList.remove("flip");
   first=null;lock=false;matched++;$("pairs").textContent=matched;
   if(matched===PAIRS)finish();
  },350);
 }else{
  setTimeout(function(){
   first.el.classList.remove("flip");el.classList.remove("flip");
   first=null;lock=false;
  },700);
 }
}

function finish(){
 saveBest(moves);showBest();
 var b=loadBest(),msg=(b===moves)?"Kỷ lục mới! 🎉":"";
 var w=$("win");w.hidden=false;
 w.textContent="Hoàn thành với "+moves+" lượt lật. "+msg;
}

$("lv1").onclick=function(){setLevel("lv1")};
$("lv2").onclick=function(){setLevel("lv2")};
$("lv3").onclick=function(){setLevel("lv3")};
$("again").onclick=newGame;

showBest();newGame();
</script>
</body>
</html>
